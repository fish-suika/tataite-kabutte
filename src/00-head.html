<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>叩いて被ってジャンケンポン（仮）</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1a14;
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;color:#fff;
  user-select:none;-webkit-user-select:none;touch-action:none;
  word-break:auto-phrase;line-break:strict;text-wrap:balance}
body{display:flex;align-items:center;justify-content:center}
.nb{display:inline-block;white-space:nowrap}

#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* 遊ぶ場所の枠（縦9:16で中央）。単位は cqw（枠の幅の1%）。触れるのは下の絵 */
#stage{position:relative;container-type:size;
  width:min(100vw,calc(100dvh*9/16));aspect-ratio:9/16;pointer-events:none}

/* タイトル */
#title{position:absolute;left:5cqw;right:5cqw;top:24cqw;z-index:20;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:3cqw}
#title.hide{display:none}
#title .t1{font-size:4.6cqw;font-weight:bold;color:#fff;background:#e23b3b;border-radius:5cqw;padding:.8cqw 4.5cqw;letter-spacing:.4cqw;box-shadow:0 .8cqw 0 #8f1f1f}
#title .t2{font-size:12cqw;font-weight:900;line-height:1.15;color:#ffd23f;
  -webkit-text-stroke:1.4cqw #7a1a1a;paint-order:stroke fill;text-shadow:0 1.4cqw 0 #7a1a1a,0 2.2cqw 3cqw #0008}
#title .t4{margin-top:3cqw;font-size:6cqw;font-weight:bold;color:#fff;background:#e0562a;border-radius:6cqw;
  padding:2cqw 8cqw;box-shadow:0 1.2cqw 0 #8f2f12;animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{transform:scale(1.07)}}

/* 結果 */
#result{position:absolute;left:7cqw;right:7cqw;top:30cqw;z-index:30;padding:5cqw 5.5cqw;
  background:#fff7e6f2;color:#4a2a10;border:.8cqw solid #e23b3b;border-radius:4cqw;
  box-shadow:0 2cqw 0 #00000055,0 3cqw 6cqw #0008;
  display:none;flex-direction:column;align-items:stretch;gap:2cqw;text-align:center;pointer-events:auto}
#result.show{display:flex;animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
#result.wait{pointer-events:none}
@keyframes pop{from{transform:scale(.7) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
#result .hd{font-size:8cqw;font-weight:900;color:#e23b3b;line-height:1.2;padding-bottom:1.6cqw;border-bottom:.5cqw solid #e23b3b88}
#result .sub{font-size:4.4cqw;color:#7a4a22;min-height:5.6cqw}
#result .ln{display:flex;justify-content:space-between;align-items:baseline;font-size:4.4cqw;
  border-bottom:.3cqw dashed #7a4a2266;padding-bottom:1cqw}
#result .ln span:first-child{color:#7a4a22}
#result .ln b{font-size:5cqw;color:#4a2a10}
#rBest{font-size:3.8cqw;color:#7a4a22;min-height:5cqw}
.row{display:flex;gap:3cqw;align-items:center;width:100%;margin-top:1cqw}
.btn{border:0;border-radius:3.6cqw;font:inherit;font-weight:bold;color:#fff;cursor:pointer;
  background:linear-gradient(#ff8a3d,#e0562a);box-shadow:0 1.2cqw 0 #8f2f12;touch-action:manipulation}
.btn:active{transform:translateY(.8cqw);box-shadow:0 .4cqw 0 #8f2f12}
#retry{flex:1;height:14cqw;font-size:5.8cqw}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="stage">
  <div id="title">
    <div class="t1">町内の 叩いて被って大会</div>
    <div class="t2"><span class="nb">叩いて</span><span class="nb">被って</span><span class="nb">ジャンケンポン</span></div>
    <div class="t4">タップで スタート</div>
  </div>
  <div id="result">
    <div class="hd" id="rHead"></div>
    <div class="sub" id="rSub"></div>
    <div class="ln"><span>最速の反応</span><b id="rFast"></b></div>
    <div class="ln"><span>叩いた回数</span><b><span id="rHits">0</span> 回</b></div>
    <div class="ln"><span>反則の回数</span><b><span id="rFouls">0</span> 回</b></div>
    <div id="rBest"></div>
    <div class="row">
      <button id="retry" class="btn">もう一回</button>
    </div>
  </div>
</div>
<script>
