<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>叩いて被ってジャンケンポン（仮）</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1a14;
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;color:#fff;
  user-select:none;-webkit-user-select:none;touch-action:none;
  word-break:auto-phrase;line-break:strict;text-wrap:balance}
body{display:flex;align-items:center;justify-content:center}
.nb{display:inline-block;white-space:nowrap}

#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* 遊ぶ場所の枠（縦9:16で中央）。単位は cqw（枠の幅の1%）。触れるのは下の絵 */
#stage{position:relative;container-type:size;
  width:min(100vw,calc(100dvh*9/16));aspect-ratio:9/16;pointer-events:none}

/* タイトル */
#title{position:absolute;left:5cqw;right:5cqw;top:24cqw;z-index:20;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:3cqw}
#title.hide{display:none}
#title .t1{font-size:4.6cqw;font-weight:bold;color:#fff;background:#e23b3b;border-radius:5cqw;padding:.8cqw 4.5cqw;letter-spacing:.4cqw;box-shadow:0 .8cqw 0 #8f1f1f}
#title .t2{font-size:12cqw;font-weight:900;line-height:1.15;color:#ffd23f;
  -webkit-text-stroke:1.4cqw #7a1a1a;paint-order:stroke fill;text-shadow:0 1.4cqw 0 #7a1a1a,0 2.2cqw 3cqw #0008}
#title .t4{margin-top:3cqw;font-size:6cqw;font-weight:bold;color:#fff;background:#e0562a;border-radius:6cqw;
  padding:2cqw 8cqw;box-shadow:0 1.2cqw 0 #8f2f12;animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{transform:scale(1.07)}}

/* 結果 */
#result{position:absolute;left:7cqw;right:7cqw;top:30cqw;z-index:30;padding:5cqw 5.5cqw;
  background:#fff7e6f2;color:#4a2a10;border:.8cqw solid #e23b3b;border-radius:4cqw;
  box-shadow:0 2cqw 0 #00000055,0 3cqw 6cqw #0008;
  display:none;flex-direction:column;align-items:stretch;gap:2cqw;text-align:center;pointer-events:auto}
#result.show{display:flex;animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
#result.wait{pointer-events:none}
@keyframes pop{from{transform:scale(.7) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
#result .hd{font-size:8cqw;font-weight:900;color:#e23b3b;line-height:1.2;padding-bottom:1.6cqw;border-bottom:.5cqw solid #e23b3b88}
#result .sub{font-size:4.4cqw;color:#7a4a22;min-height:5.6cqw}
#result .ln{display:flex;justify-content:space-between;align-items:baseline;font-size:4.4cqw;
  border-bottom:.3cqw dashed #7a4a2266;padding-bottom:1cqw}
#result .ln span:first-child{color:#7a4a22}
#result .ln b{font-size:5cqw;color:#4a2a10}
#rBest{font-size:3.8cqw;color:#7a4a22;min-height:5cqw}
.row{display:flex;gap:3cqw;align-items:center;width:100%;margin-top:1cqw}
.btn{border:0;border-radius:3.6cqw;font:inherit;font-weight:bold;color:#fff;cursor:pointer;
  background:linear-gradient(#ff8a3d,#e0562a);box-shadow:0 1.2cqw 0 #8f2f12;touch-action:manipulation}
.btn:active{transform:translateY(.8cqw);box-shadow:0 .4cqw 0 #8f2f12}
#retry{flex:1;height:14cqw;font-size:5.8cqw}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="stage">
  <div id="title">
    <div class="t1">町内の 叩いて被って大会</div>
    <div class="t2"><span class="nb">叩いて</span><span class="nb">被って</span><span class="nb">ジャンケンポン</span></div>
    <div class="t4">タップで スタート</div>
  </div>
  <div id="result">
    <div class="hd" id="rHead"></div>
    <div class="sub" id="rSub"></div>
    <div class="ln"><span>最速の反応</span><b id="rFast"></b></div>
    <div class="ln"><span>叩いた回数</span><b><span id="rHits">0</span> 回</b></div>
    <div class="ln"><span>反則の回数</span><b><span id="rFouls">0</span> 回</b></div>
    <div id="rBest"></div>
    <div class="row">
      <button id="retry" class="btn">もう一回</button>
    </div>
  </div>
</div>
<script>
// ===== 調整用の数値（遊びながらここを触る）=====
// 論理座標：幅 100 × 高さ 177.8（9:16）。時間の単位はすべて秒。
const CFG = {
  W: 100, H: 177.8,
  // --- 合図のテンポ（手を選ぶまでは待つ。選んだ瞬間から「ジャン」が始まる）---
  readyT: 0.7,        // 試合の最初の間（実況が出る）
  nextOppT: 1.0,      // 次の相手に変わるときの、さらに追加の間
  gapT: 0.4,          // 1 回のあと、手を選べるようになるまで（この間に前もって選んでもよい）
  janT: 0.4,          // 「ジャン」の長さ（手は選び直せる）
  kenT: 0.4,          // 「ケン」の長さ（手は選び直せる）
  aikoCall: 0.5,      // あいこのとき「あいこで」の長さ（これが終わると「しょ」で手が出る）
  drawHold: 0.7,      // あいこの手を見せておく間
  grabTimeout: 1.5,   // 「ポン」から何も取らないままこの時間が過ぎると決着
  resultHold: 1.2,    // 決着を見せておく間
  // --- 試合 ---
  winPoints: 2,       // 先取の本数（長すぎれば 1 にする）
  // --- 反応の秒数のほめ言葉（以下ならその言葉。小さい順）---
  praise: [[0.35, '神速'], [0.45, '速い'], [0.60, 'いいね']],
  // --- 相手（回戦の順。最後が決勝）---
  //  mean: 反応の平均 / spread: ばらつき（標準偏差）/ mistake: 取り違える確率 / min: これより速くは反応しない
  //  habit: ジャンケンのクセ { type, s: クセの強さ（その手を出す確率。外れたら 3 つから気まぐれ） }
  //    type: goo グーが多い / loser 前回負けた手に勝つ手 / repeat 同じ手を続ける / none ばらばら / counter こちらの前回の手に勝つ手
  //    s = 0.5 だと実際にクセの手が出る割合は約 67%
  opps: [
    { name: '近所の小学生',     mean: 0.90, spread: 0.18, mistake: 0.12, min: 0.30, habit: { type: 'goo',     s: 0.5 } },
    { name: '学級委員長',       mean: 0.70, spread: 0.14, mistake: 0.06, min: 0.30, habit: { type: 'loser',   s: 0.5 } },
    { name: '体育の先生',       mean: 0.58, spread: 0.12, mistake: 0.02, min: 0.28, habit: { type: 'repeat',  s: 0.5 } },
    { name: '商店街のおばあちゃん', mean: 0.50, spread: 0.10, mistake: 0,    min: 0.25, habit: { type: 'none',    s: 0 } },
    { name: '町内チャンピオン', mean: 0.47, spread: 0.10, mistake: 0,    min: 0.25, habit: { type: 'counter', s: 0.5 } }
  ],
  overDelay: 0.5      // 勝ち抜き戦が終わってから結果を出すまで（UI 側。ロジックの resultHold のあと）
};
// ===== ゲームのロジック（画面を使わない。時刻は秒で明示的に渡す）=====
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 手：0 グー・1 チョキ・2 パー（グー＞チョキ＞パー＞グー）
const HAND_NAME = ['グー', 'チョキ', 'パー'];
const HAND_ICON = ['✊', '✌️', '✋'];
// a から見た b との勝ち負け
function rpsOf(a, b) {
  if (a === b) return 'draw';
  return ((b - a + 3) % 3 === 1) ? 'win' : 'lose';
}
// 反応の秒数 → ほめ言葉（なければ ''）
function praiseOf(sec) {
  for (const [lim, word] of CFG.praise) if (sec <= lim) return word;
  return '';
}

// 実況の一言
const COMM = {
  hit: '決まった！', guarded: 'ガード！', wrongHelmet: 'あれ？被っちゃった',
  cpuHit: '叩かれた！', guard: 'ナイスガード！', foul: '反則！', cpuFoul: '相手の反則！', nothing: '…様子見'
};

// 1 回の決着を決める純粋な関数（表の全部の行がここ）。時刻はすべて「ポン」からの秒数。
//   rps: 自分から見た 'win' | 'lose'
//   pItem: 自分が最初に取った道具 'hammer' | 'helmet' | null（取らなかった）、pT: その時刻
//   cItem / cT: 相手が取る道具と時刻（「ポン」の時点で決めておく）
// 返り値 { type, point('p' 自分 | 'c' 相手 | null), at }
//   type: hit 叩いた / guarded ガードされた / wrongHelmet 勝ったのに被った / cpuHit 叩かれた /
//         guard ガード成功 / foul 反則（負けたのにハンマー）/ cpuFoul 相手の反則 / nothing 何もなし
// 同時刻は守る側（ヘルメット）を優先する。
function resolveRound(rps, pItem, pT, cItem, cT, timeout) {
  // 相手が自分だけで決める出来事（相手がハンマーを取ったとき）
  let auto = null;
  if (cItem === 'hammer') {
    auto = rps === 'lose' ? { type: 'cpuHit', point: 'c', at: cT } : { type: 'cpuFoul', point: 'p', at: cT };
  }
  // 自分の出来事
  let pe = null;
  if (pItem === 'hammer') {
    if (rps === 'lose') pe = { type: 'foul', point: 'c', at: pT };
    else if (cItem === 'helmet' && cT <= pT) pe = { type: 'guarded', point: null, at: pT };
    else pe = { type: 'hit', point: 'p', at: pT };
  } else if (pItem === 'helmet') {
    if (rps === 'win') pe = { type: 'wrongHelmet', point: null, at: pT };
    else pe = { type: 'guard', point: null, at: pT };
  }
  if (pe && auto) {
    // 早い方。同時刻は自分（ヘルメットのガード）を先にする
    return auto.at < pe.at ? auto : pe;
  }
  if (pe) return pe;
  if (auto) return auto;
  // どちらも取らないまま時間切れ
  return rps === 'lose' ? { type: 'cpuHit', point: 'c', at: timeout, timeout: true } : { type: 'nothing', point: null, at: timeout, timeout: true };
}

// a に勝つ手
const winHand = h => (h + 2) % 3;
// 回戦の名前（最後は決勝）
function roundLabel(i) { return i === CFG.opps.length - 1 ? '決勝' : (i + 1) + '回戦'; }

// 相手のクセが「いま出したがっている手」（クセを読んだときの答え）。なければ null
//   goo: いつもグー寄り / loser: 前回負けた手に勝つ手 / repeat: 同じ手を続ける
//   counter: こちらの前回の手に勝つ手 / none: ばらばら
// hist は直前までの手の記録 [{ p: 自分の手, c: 相手の手 }]（この相手との試合の中だけ）
function habitHandOf(opp, hist) {
  const hb = opp.habit;
  if (!hb) return null;
  const last = hist[hist.length - 1];
  switch (hb.type) {
    case 'goo': return 0;
    case 'repeat': return last ? last.c : null;
    case 'loser': {
      if (!last) return null;
      const r = rpsOf(last.p, last.c);
      if (r === 'draw') return null;
      return winHand(r === 'win' ? last.c : last.p);
    }
    case 'counter': return last ? winHand(last.p) : null;
    default: return null;
  }
}

const Game = {
  mode: 'title',        // title → match（勝ち抜き戦の全体）→ over
  phase: '',            // ready → wait（手を選ぶのを待つ）→ call → grab → result → ready … / あいこ: draw → wait …
  time: 0, endT: 0, phaseT0: 0,
  seed: 1, rand: null,
  events: [],

  reset(seed) {
    this.seed = seed == null ? (Date.now() & 0xffffff) : seed;
    this.rand = mulberry32(this.seed);
    this.mode = 'title'; this.phase = ''; this.time = 0; this.endT = 0; this.phaseT0 = 0;
    this.oppIdx = 0; this.opp = CFG.opps[0];
    this.score = { p: 0, c: 0 };
    this.matchResult = '';         // いまの相手との試合：'win' | 'lose'
    this.tourney = '';             // 勝ち抜き戦の結果：'champion' | 'out'
    this.comm = '';
    this.hist = [];                // この相手との試合で出した手の記録 { p, c }
    this.fastest = null;           // 通しての最速（正しい道具を取ったときだけ）
    this.stats = { hits: 0, fouls: 0, guards: 0, wrong: 0 };
    this.clearRound();
    this.events = [];
  },

  clearRound() {
    this.aiko = false; this.callIdx = 0; this.callText = '';
    this.chosen = null;
    this.pHand = null; this.cHand = null; this.rps = '';
    this.ponT = 0; this.cpuDone = false;
    this.cItem = null; this.cReact = 0; this.cMistake = false;
    this.pItem = null; this.pReact = null; this.pCorrect = false; this.pPraise = '';
    this.outcome = ''; this.point = null; this.resolveT = 0;
  },

  emit(e) { e.t = this.time; this.events.push(e); },
  enter(phase, t, dur) { this.phase = phase; this.phaseT0 = t; this.endT = t + dur; },

  // タイトルのタップ。すぐ 1 回戦が始まる
  begin(t) {
    if (this.mode !== 'title') return false;
    this.time = Math.max(this.time, t || 0);
    this.mode = 'match';
    this.oppIdx = 0;
    this.fastest = null;
    this.stats = { hits: 0, fouls: 0, guards: 0, wrong: 0 };
    this.tourney = '';
    this.beginOpp(this.time, CFG.readyT, 'start');
    return true;
  },

  // 相手との試合を始める（最初の相手も、次の相手もここ）
  beginOpp(t, dur, evType) {
    this.opp = CFG.opps[this.oppIdx];
    this.score = { p: 0, c: 0 };
    this.matchResult = '';
    this.hist = [];
    this.clearRound();
    this.comm = roundLabel(this.oppIdx) + '、はじめ';
    this.enter('ready', t, dur);
    this.emit({ type: evType, idx: this.oppIdx });
  },

  // 手を選ぶのを待つ（時間制限なし）。選んだ時刻から「ジャン」が始まる
  startWait(t) {
    this.phase = 'wait'; this.phaseT0 = t; this.endT = Infinity;
    this.emit({ type: 'wait', aiko: this.aiko });
  },

  startCall(t) {
    this.callIdx = 0;
    this.callText = this.aiko ? 'あいこで' : 'ジャン';
    this.enter('call', t, this.aiko ? CFG.aikoCall : CFG.janT);
    this.emit({ type: 'call', idx: 0, text: this.callText, aiko: this.aiko });
  },

  // 時刻 t まで進める。strict のときは t ちょうどの出来事は先に処理しない（同時は守る側が勝つため）
  advanceTo(t, strict) {
    if (!isFinite(t)) return;
    if (this.mode === 'match') {
      for (let guard = 0; guard < 1000; guard++) {
        let evT = this.endT, kind = 'phase';
        if (this.phase === 'grab' && !this.cpuDone) {
          const ct = this.ponT + this.cReact;
          if (ct <= evT) { evT = ct; kind = 'cpu'; }
        }
        if (strict ? evT >= t : evT > t) break;
        this.time = Math.max(this.time, evT);
        if (kind === 'cpu') this.cpuEvent(evT); else this.phaseEnd();
        if (this.mode !== 'match') break;
      }
    }
    this.time = Math.max(this.time, t);
  },

  phaseEnd() {
    const t = this.endT;
    switch (this.phase) {
      case 'ready':
        if (this.chosen != null) this.startCall(t);   // 前もって選んでいたらすぐ「ジャン」
        else this.startWait(t);
        break;
      case 'call':
        if (!this.aiko && this.callIdx === 0) {
          this.callIdx = 1; this.callText = 'ケン';
          this.enter('call', t, CFG.kenT);
          this.emit({ type: 'call', idx: 1, text: 'ケン', aiko: false });
        } else this.pon(t);
        break;
      case 'draw':
        this.clearRound(); this.aiko = true;
        this.startWait(t);
        break;
      case 'grab':   // 時間切れ
        if (!this.outcome) this.finish(resolveRound(this.rps, this.pItem, this.pReact, this.cItem, this.cReact, CFG.grabTimeout), t);
        break;
      case 'result':
        if (this.matchResult === 'win' && this.oppIdx < CFG.opps.length - 1) {
          this.oppIdx++;
          this.beginOpp(t, CFG.readyT + CFG.nextOppT, 'nextOpp');
        } else if (this.matchResult) {
          this.tourney = this.matchResult === 'win' ? 'champion' : 'out';
          this.mode = 'over'; this.phase = 'over';
          this.emit({ type: 'over', tourney: this.tourney });
        } else {
          this.clearRound();
          this.comm = '';
          this.enter('ready', t, CFG.gapT);
        }
        break;
    }
  },

  // 相手のジャンケンのクセ。クセの強さ s の確率でクセの手、外れたら気まぐれ（3 つから）
  pickCpuHand() {
    const r = this.rand;
    const a = r(), b = r();
    const h = habitHandOf(this.opp, this.hist);
    if (h != null && a < this.opp.habit.s) return h;
    return Math.floor(b * 3);
  },

  // 「ポン」（あいこのときは「しょ」）
  pon(t) {
    this.ponT = t;
    this.pHand = this.chosen != null ? this.chosen : 0;
    this.cHand = this.pickCpuHand();
    this.rps = rpsOf(this.pHand, this.cHand);
    this.hist.push({ p: this.pHand, c: this.cHand });
    this.callText = this.aiko ? 'しょ' : 'ポン';
    // 相手の反応は「ポン」の時点で決めておく
    const r = this.rand, o = this.opp;
    const z = (r() + r() + r() - 1.5) / 0.5;           // ほぼ正規分布（標準偏差 1）
    this.cReact = Math.round(clamp(o.mean + z * o.spread, o.min, CFG.grabTimeout - 0.1) * 1e6) / 1e6;
    this.cMistake = r() < o.mistake;
    this.cpuDone = false; this.pItem = null;
    this.emit({ type: 'pon', text: this.callText, aiko: this.aiko, pHand: this.pHand, cHand: this.cHand, rps: this.rps });
    if (this.rps === 'draw') {
      this.cItem = null;
      this.comm = 'あいこ';
      this.enter('draw', t, CFG.drawHold);
      this.emit({ type: 'draw' });
      return;
    }
    const cWins = this.rps === 'lose';                  // 相手が勝ったなら正解はハンマー
    this.cItem = (cWins !== this.cMistake) ? 'hammer' : 'helmet';
    this.comm = '';
    this.enter('grab', t, CFG.grabTimeout);
  },

  // 相手が道具を取る
  cpuEvent(t) {
    this.cpuDone = true;
    this.emit({ type: 'cpuTake', item: this.cItem, mistake: this.cMistake });
    if (this.cItem === 'hammer' && !this.outcome) {
      this.finish(resolveRound(this.rps, this.pItem, this.pReact, this.cItem, this.cReact, CFG.grabTimeout), t);
    }
  },

  // 手を選ぶ。待っているとき（wait）はここから「ジャン」が始まる。「ジャン」「ケン」の間は選び直せる。
  // 次の回の前の間（ready）に前もって選んでおくこともできる
  selectHand(h, t) {
    if (t != null) this.advanceTo(t, true);
    if (this.mode !== 'match') return false;
    if (this.phase === 'wait') {
      this.chosen = h;
      this.emit({ type: 'select', hand: h });
      this.startCall(Math.max(t == null ? this.time : t, this.time));
      return true;
    }
    if (this.phase === 'call' || this.phase === 'ready') {
      this.chosen = h;
      this.emit({ type: 'select', hand: h });
      return true;
    }
    return false;
  },

  // 道具をタップ（pointerdown の時刻 t で即判定）
  tapItem(which, t) {
    if (t == null) t = this.time;
    this.advanceTo(t, true);
    if (this.mode !== 'match' || this.phase !== 'grab' || this.pItem || this.outcome) return false;
    if (t < this.ponT) return false;                    // 「ポン」より前の分は無効
    const rel = Math.round((t - this.ponT) * 1e6) / 1e6;   // 浮動小数の誤差で同時刻がずれないように
    this.pItem = which; this.pReact = rel;
    this.pCorrect = (this.rps === 'win' && which === 'hammer') || (this.rps === 'lose' && which === 'helmet');
    this.pPraise = this.pCorrect ? praiseOf(rel) : '';
    if (this.pCorrect && (this.fastest == null || rel < this.fastest)) this.fastest = rel;
    this.emit({ type: 'tap', item: which, react: rel, correct: this.pCorrect, praise: this.pPraise });
    const r = resolveRound(this.rps, which, rel, this.cItem, this.cReact, CFG.grabTimeout);
    this.finish(r, this.ponT + r.at);
    return true;
  },

  finish(r, t) {
    this.time = Math.max(this.time, t);
    this.outcome = r.type; this.point = r.point; this.resolveT = t;
    if (r.point === 'p') this.score.p++;
    if (r.point === 'c') this.score.c++;
    if (r.type === 'hit') this.stats.hits++;
    if (r.type === 'foul') this.stats.fouls++;
    if (r.type === 'guard') this.stats.guards++;
    if (r.type === 'wrongHelmet') this.stats.wrong++;
    this.comm = COMM[r.type] || '';
    if (this.score.p >= CFG.winPoints) this.matchResult = 'win';
    else if (this.score.c >= CFG.winPoints) this.matchResult = 'lose';
    this.enter('result', t, CFG.resultHold);
    this.emit({ type: 'outcome', outcome: r.type, point: r.point, timeout: !!r.timeout, score: { p: this.score.p, c: this.score.c }, matchResult: this.matchResult, oppIdx: this.oppIdx });
  }
};
// ===== 描画（仮の絵：丸・四角・文字・絵文字）。Phase 3 で本番の絵にする =====
const $ = id => document.getElementById(id);
const cv = $('cv'), g = cv.getContext('2d');
const FONT = '"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo","Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
let S = 1, OX = 0, OY = 0, DPR = 1, vw = 0, vh = 0;
let shakeT = 0, shakeAmp = 0, flashT = 0, flashColor = '#fff';
const popups = [], parts = [];
const pressT = [0, 0, 0];          // 手のボタンを押したときの光り
const itemPress = { hammer: 0, helmet: 0 };
let react = null;                  // 直近の反応の秒数の表示 { sec, praise, correct }
let faceMood = 'normal', faceT = 0;

// 画面の部品の位置（論理座標）。タップの判定にも使う
const LAY = {
  cpuHand: { x: 50, y: 67, size: 21 },
  myHand:  { x: 50, y: 92, size: 21 },
  face:    { x: 50, y: 42, r: 9 },
  tableY: 106,
  btnY: 146, btnH: 27,
  btns: [{ x: 4, w: 30 }, { x: 35, w: 30 }, { x: 66, w: 30 }],
  hammer: { x: 4, y: 110, w: 44, h: 34, cx: 26, cy: 126 },
  helmet: { x: 52, y: 110, w: 44, h: 34, cx: 74, cy: 126 }
};

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  vw = window.innerWidth; vh = window.innerHeight;
  cv.width = Math.round(vw * DPR); cv.height = Math.round(vh * DPR);
  S = Math.min(vw / CFG.W, vh / CFG.H) * DPR;
  OX = (cv.width - CFG.W * S) / 2; OY = (cv.height - CFG.H * S) / 2;
}
const sx = x => OX + x * S;
const sy = y => OY + y * S;
function view() { return { x0: -OX / S, x1: (cv.width - OX) / S, y0: -OY / S, y1: (cv.height - OY) / S }; }
// 画面の座標（clientX/Y）→ 論理座標
function toLogic(cx, cy) { return { x: (cx * DPR - OX) / S, y: (cy * DPR - OY) / S }; }

function addPopup(text, x, y, size, color, life) { popups.push({ text, x, y, size, color, life: life || 0.9, t: 0 }); }
function burst(x, y, color, n, speed, life, star) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.2832, v = (0.4 + Math.random() * 0.6) * (speed || 30);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 8, life: (life || 0.6) * (0.6 + Math.random() * 0.5), t: 0, color, size: 1.5 + Math.random() * 1.8, star: !!star, rot: Math.random() * 6 });
  }
}
function shake(amp, dur) { shakeAmp = amp; shakeT = dur; }
function flash(color, dur) { flashColor = color; flashT = dur; }

function updateVisual(dt) {
  shakeT = Math.max(0, shakeT - dt);
  flashT = Math.max(0, flashT - dt);
  faceT = Math.max(0, faceT - dt);
  for (let i = 0; i < 3; i++) pressT[i] = Math.max(0, pressT[i] - dt);
  itemPress.hammer = Math.max(0, itemPress.hammer - dt);
  itemPress.helmet = Math.max(0, itemPress.helmet - dt);
  for (const p of popups) p.t += dt;
  for (let i = popups.length - 1; i >= 0; i--) if (popups[i].t > popups[i].life) popups.splice(i, 1);
  for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 50 * dt; p.rot += dt * 6; }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].t > parts[i].life) parts.splice(i, 1);
}

// ---------- 基本の図形 ----------
function rr(x, y, w, h, r) {
  const X = sx(x), Y = sy(y), W = w * S, H = h * S, R = r * S;
  g.beginPath(); g.moveTo(X + R, Y); g.arcTo(X + W, Y, X + W, Y + H, R); g.arcTo(X + W, Y + H, X, Y + H, R);
  g.arcTo(X, Y + H, X, Y, R); g.arcTo(X, Y, X + W, Y, R); g.closePath();
}
function fillRR(x, y, w, h, r, fill, stroke, lw) {
  rr(x, y, w, h, r);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = (lw || 0.6) * S; g.stroke(); }
}
function circle(x, y, r, fill, stroke, lw) {
  g.beginPath(); g.arc(sx(x), sy(y), r * S, 0, 6.2832);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = (lw || 0.6) * S; g.stroke(); }
}
function rect(x, y, w, h, fill) { g.fillStyle = fill; g.fillRect(sx(x), sy(y), w * S, h * S); }
function txt(str, x, y, size, fill, o) {
  o = o || {};
  g.font = (o.weight || 'bold') + ' ' + (size * S) + 'px ' + FONT;
  g.textAlign = o.align || 'center'; g.textBaseline = o.base || 'middle';
  if (o.stroke) { g.lineJoin = 'round'; g.lineWidth = (o.sw || size * 0.18) * S; g.strokeStyle = o.stroke; g.strokeText(str, sx(x), sy(y)); }
  g.fillStyle = fill; g.fillText(str, sx(x), sy(y));
}
function star(x, y, r, fill, rot) {
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot + i * Math.PI / 5 - Math.PI / 2, rad = (i % 2 ? r * 0.45 : r) * S;
    const px = sx(x) + Math.cos(a) * rad, py = sy(y) + Math.sin(a) * rad;
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.closePath(); g.fillStyle = fill; g.fill();
}

// ---------- 背景（仮：体育館の舞台と机）----------
function drawBackground() {
  const v = view();
  rect(v.x0, v.y0, v.x1 - v.x0, v.y1 - v.y0, '#2a1a14');
  rect(v.x0, v.y0, v.x1 - v.x0, LAY.tableY - v.y0, '#fff1d6');          // 壁
  rect(v.x0, LAY.tableY, v.x1 - v.x0, v.y1 - LAY.tableY, '#b9783c');    // 机
  rect(v.x0, LAY.tableY, v.x1 - v.x0, 1.2, '#7a4a22');
  rect(v.x0, LAY.btnY - 2.5, v.x1 - v.x0, v.y1 - LAY.btnY + 2.5, '#8f5a2c');
  // 紅白幕
  const x0 = Math.floor(v.x0 / 10) * 10;
  for (let x = x0; x < v.x1; x += 10) rect(x, v.y0, 10, 9 - v.y0, (Math.round(x / 10) % 2) ? '#e23b3b' : '#ffffff');
  rect(v.x0, 9, v.x1 - v.x0, 0.8, '#b22a2a');
}

// ---------- 手（グー・チョキ・パーは色と絵文字と名前で見分ける）----------
const HAND_COL = ['#ff8a80', '#8be39a', '#8ec9ff'];
function drawHand(h, cx, cy, size, a, label) {
  g.globalAlpha = a;
  circle(cx, cy, size * 0.62, HAND_COL[h], '#fff', 1);
  g.font = (size * 0.95 * S) + 'px ' + FONT;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#000';
  g.fillText(HAND_ICON[h], sx(cx), sy(cy + size * 0.04));
  if (label) txt(HAND_NAME[h], cx, cy + size * 0.78, 4.4, '#fff', { stroke: '#4a2a10' });
  g.globalAlpha = 1;
}
function drawUnknown(cx, cy, size, nowT) {
  circle(cx, cy, size * 0.6, '#e8dcc8', '#b9a98c', 1);
  txt('？', cx, cy + Math.sin(nowT * 8) * 0.8, size * 0.8, '#8a7a5c');
}

// ---------- 道具（仮：ピコピコハンマーと工事用ヘルメット）----------
function drawHammer(cx, cy, k, rot, alpha) {
  g.save(); g.globalAlpha = alpha == null ? 1 : alpha;
  g.translate(sx(cx), sy(cy)); g.rotate(rot || 0); g.scale(k, k);
  // 柄
  g.fillStyle = '#f2c14e'; g.strokeStyle = '#7a4a22'; g.lineWidth = 0.5 * S;
  g.fillRect(-1.4 * S, -2 * S, 2.8 * S, 15 * S); g.strokeRect(-1.4 * S, -2 * S, 2.8 * S, 15 * S);
  // 頭（赤と黄色）
  g.fillStyle = '#e23b3b'; g.fillRect(-11 * S, -12 * S, 22 * S, 10 * S); g.strokeRect(-11 * S, -12 * S, 22 * S, 10 * S);
  g.fillStyle = '#ffd23f'; g.fillRect(-11 * S, -12 * S, 3 * S, 10 * S); g.fillRect(8 * S, -12 * S, 3 * S, 10 * S);
  g.restore();
}
function drawHelmet(cx, cy, k, alpha) {
  g.save(); g.globalAlpha = alpha == null ? 1 : alpha;
  g.translate(sx(cx), sy(cy)); g.scale(k, k);
  g.fillStyle = '#ffd23f'; g.strokeStyle = '#8a6a00'; g.lineWidth = 0.6 * S;
  g.beginPath(); g.arc(0, 2 * S, 12 * S, Math.PI, 0); g.closePath(); g.fill(); g.stroke();
  g.fillRect(-15 * S, 2 * S, 30 * S, 3.4 * S); g.strokeRect(-15 * S, 2 * S, 30 * S, 3.4 * S);
  g.fillStyle = '#fff3a8'; g.fillRect(-1.6 * S, -9 * S, 3.2 * S, 11 * S);
  g.restore();
}

// ---------- 相手の顔（仮：丸。相手ごとに服と髪の色だけ変える）----------
const OPP_LOOK = [
  { body: '#4a88d8', hair: '#3a2a1a' }, { body: '#3aa05a', hair: '#1a1a2a' }, { body: '#e06a2a', hair: '#2a2a2a' },
  { body: '#b86ad8', hair: '#d8d8d8' }, { body: '#d82a2a', hair: '#e8b82a' }
];
function drawFace(nowT) {
  const f = LAY.face;
  const mood = faceT > 0 ? faceMood : 'normal';
  let bob = Math.sin(nowT * 3) * 0.4, ox = 0, oy = bob;
  if (mood === 'dizzy') ox = Math.sin(nowT * 30) * 0.6;
  // 体
  const LOOK = OPP_LOOK[Math.min(Game.oppIdx, OPP_LOOK.length - 1)];
  fillRR(f.x - 15, f.y + f.r - 2, 30, 14, 6, LOOK.body, '#2a2a2a', 0.6);
  circle(f.x + ox, f.y + oy, f.r, '#ffd9b3', '#7a4a22', 0.7);
  // 髪
  g.beginPath(); g.arc(sx(f.x + ox), sy(f.y + oy), f.r * S, Math.PI * 1.05, Math.PI * 1.95); g.fillStyle = LOOK.hair; g.fill();
  const ex = 3.2, ey = f.y + oy - 0.5;
  if (mood === 'dizzy') {
    txt('@', f.x + ox - ex, ey, 4.2, '#333'); txt('@', f.x + ox + ex, ey, 4.2, '#333');
    txt('ー', f.x + ox, f.y + oy + 4.5, 3.4, '#a33');
  } else if (mood === 'huh') {
    circle(f.x - ex, ey, 1.1, '#333'); circle(f.x + ex, ey, 1.1, '#333');
    txt('？', f.x + 11, f.y - 7, 7, '#e23b3b', { stroke: '#fff' });
    circle(f.x, f.y + 4.5, 1, '#a33');
  } else if (mood === 'grin') {
    txt('＾', f.x - ex, ey, 4, '#333'); txt('＾', f.x + ex, ey, 4, '#333');
    fillRR(f.x - 2.6, f.y + 3.4, 5.2, 2.6, 1.2, '#a33');
  } else if (mood === 'sweat') {
    circle(f.x - ex, ey, 1.1, '#333'); circle(f.x + ex, ey, 1.1, '#333');
    txt('💦', f.x + 10, f.y - 5, 5);
    txt('～', f.x, f.y + 4.5, 3, '#a33');
  } else {
    circle(f.x - ex, ey, 1.1, '#333'); circle(f.x + ex, ey, 1.1, '#333');
    fillRR(f.x - 2, f.y + 4, 4, 1, 0.5, '#a33');
  }
  // 相手が取った道具
  if (Game.mode === 'match' && Game.cItem && (Game.cpuDone || Game.outcome) && Game.phase !== 'ready' && Game.cpuDone) {
    if (Game.cItem === 'helmet') drawHelmet(f.x + ox, f.y + oy - f.r + 3.2, 0.95);
    else drawHammer(f.x + 22, f.y + 6, 0.8, 0.5);
  }
}

// ---------- 画面の描画 ----------
function render(nowT) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, cv.width, cv.height);
  g.save();
  if (shakeT > 0) g.translate((Math.random() - 0.5) * shakeAmp * S, (Math.random() - 0.5) * shakeAmp * S);
  drawBackground();
  drawFace(nowT);
  if (Game.mode !== 'title') { drawHud(nowT); drawHands(nowT); drawTable(nowT); drawButtons(nowT); drawCallText(nowT); }
  else { drawHands(nowT); drawTable(nowT); drawButtons(nowT); }
  // 粒・文字
  for (const p of parts) {
    g.globalAlpha = clamp(1 - p.t / p.life, 0, 1);
    if (p.star) star(p.x, p.y, p.size, p.color, p.rot); else circle(p.x, p.y, p.size * 0.5, p.color);
  }
  g.globalAlpha = 1;
  for (const p of popups) {
    const k = p.t / p.life;
    g.globalAlpha = k > 0.7 ? clamp((1 - k) / 0.3, 0, 1) : 1;
    const sc = k < 0.15 ? 0.6 + k / 0.15 * 0.55 : 1.15 - Math.min(0.15, (k - 0.15) * 0.4);
    txt(p.text, p.x, p.y - k * 5, p.size * sc, p.color, { stroke: '#3a1a08', sw: p.size * 0.22 });
  }
  g.globalAlpha = 1;
  g.restore();
  if (flashT > 0) { g.globalAlpha = clamp(flashT / 0.25, 0, 1) * 0.35; g.fillStyle = flashColor; g.fillRect(0, 0, cv.width, cv.height); g.globalAlpha = 1; }
}

// 相手の直前の手の記録（小さく 3 回分。新しい順に左から）
function drawCpuHistory() {
  const shown = Game.hist || [];   // 「ポン」で出た手もすぐ記録に入る
  for (let i = 0; i < 3; i++) {
    const e = shown[shown.length - 1 - i];
    const x = 76 + i * 9.5, y = 44;
    circle(x, y, 4.2, e ? HAND_COL[e.c] : 'rgba(255,255,255,0.35)', '#fff', 0.5);
    if (e) { g.font = (5.6 * S) + 'px ' + FONT; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#000'; g.fillText(HAND_ICON[e.c], sx(x), sy(y + 0.2)); }
  }
}

function drawHud(nowT) {
  const opp = Game.opp || CFG.opps[0];
  txt(roundLabel(Game.oppIdx) + '　' + opp.name, 50, 4.6, 4.6, '#fff', { stroke: '#7a1a1a' });
  // 本数の丸（左：あなた、右：相手）
  for (let i = 0; i < CFG.winPoints; i++) {
    circle(10 + i * 8, 16, 3, i < Game.score.p ? '#ffd23f' : 'rgba(255,255,255,0.5)', '#7a4a22', 0.6);
    circle(90 - i * 8, 16, 3, i < Game.score.c ? '#ff6b6b' : 'rgba(255,255,255,0.5)', '#7a4a22', 0.6);
  }
  txt('あなた', 14, 22.5, 3.2, '#5a3a1a'); txt('相手', 86, 22.5, 3.2, '#5a3a1a');
  drawCpuHistory();
  // 実況（上に一言）
  fillRR(22, 14, 56, 9.5, 4, 'rgba(255,255,255,0.92)', '#7a4a22', 0.5);
  if (Game.comm) txt(Game.comm, 50, 18.9, 4.8, '#4a2a10');
}

function drawHands(nowT) {
  const c = LAY.cpuHand, m = LAY.myHand;
  const inCall = Game.mode === 'match' && Game.phase === 'call';
  const revealed = Game.mode === 'match' && Game.pHand != null && (Game.phase === 'grab' || Game.phase === 'draw' || Game.phase === 'result' || Game.phase === 'over');
  if (revealed) {
    const k = clamp((nowT - Game.ponT) / 0.14, 0, 1);
    const sc = 0.5 + 0.5 * (1 - Math.pow(1 - k, 3)) + (k < 1 ? 0.15 * k : 0);
    drawHand(Game.cHand, c.x, c.y, c.size * sc, 1, true);
    drawHand(Game.pHand, m.x, m.y, m.size * sc, 1, true);
    if (Game.defaulted && Game.phase === 'grab') { /* 前回と同じ手。罰はなし */ }
  } else {
    drawUnknown(c.x, c.y, c.size, nowT);
    if ((inCall || (Game.mode === 'match' && Game.phase === 'ready')) && Game.chosen != null) drawHand(Game.chosen, m.x, m.y, m.size, 0.35, false);
    else drawUnknown(m.x, m.y, m.size * 0.9, nowT + 1);
  }
  // 反応の秒数とほめ言葉（自分の手のよこ）
  if (react && Game.mode !== 'title') {
    const rx = 82, ry = m.y - 2;
    txt(react.sec.toFixed(2) + '秒', rx, ry, 7.2, react.correct ? '#fff' : '#d8d0c4', { stroke: '#3a1a08' });
    if (react.praise) txt(react.praise, rx, ry + 8, react.correct ? 6.4 : 5, '#ffd23f', { stroke: '#3a1a08' });
  }
}

function drawTable(nowT) {
  const live = Game.mode === 'match' && Game.phase === 'grab' && !Game.pItem;
  const mine = Game.mode === 'match' ? Game.pItem : null;
  for (const which of ['hammer', 'helmet']) {
    const L = LAY[which];
    const taken = mine === which;
    const dim = mine && !taken ? 0.4 : 1;
    // 置き場
    fillRR(L.x, L.y, L.w, L.h, 5, live ? 'rgba(255,255,255,0.22)' : 'rgba(0,0,0,0.12)', live ? '#fff' : 'rgba(0,0,0,0.25)', live ? 0.7 : 0.4);
    const press = itemPress[which] > 0 ? 1.12 : 1;
    const lift = taken ? -6 : 0;
    const k = (taken ? 1.25 : 1) * press;
    if (which === 'hammer') drawHammer(L.cx, L.cy + 4 + lift, 1.05 * k, -0.35, dim);
    else drawHelmet(L.cx, L.cy + 3 + lift, 1.2 * k, dim);
    if (taken) circle(L.cx, L.cy, 17, null, '#ffd23f', 1.2);
  }
  // 叩く・叩かれる動き
  if (Game.mode === 'match' && (Game.phase === 'result' || Game.phase === 'over') && Game.outcome) {
    const k = clamp((nowT - Game.resolveT) / 0.18, 0, 1);
    const o = Game.outcome;
    if (o === 'hit' || o === 'cpuFoul') {
      drawHammer(LAY.face.x + 4, LAY.face.y - 14 + k * 8, 1.5, -0.5 + k * 0.7);
    } else if (o === 'cpuHit' || o === 'foul') {
      drawHammer(50, 40 + k * 55, 2.1, 0.1 - k * 0.2);
    }
  }
}

function drawButtons(nowT) {
  const m = Game.mode === 'match';
  const waiting = m && (Game.phase === 'wait' || (Game.phase === 'ready' && Game.chosen == null));   // 手を選ぶのを待っている
  const live = m && (Game.phase === 'call' || waiting || Game.phase === 'ready');
  const pulse = 0.5 + 0.5 * Math.sin(nowT * 7);
  for (let h = 0; h < 3; h++) {
    const b = LAY.btns[h];
    const sel = m && (Game.phase === 'call' || Game.phase === 'ready') && Game.chosen === h;
    const down = pressT[h] > 0;
    const y = LAY.btnY + (down ? 1.2 : 0) - (waiting ? pulse * 1.2 : 0);
    if (waiting) {   // 手のボタンがやわらかく光って弾む（文字の説明は出さない）
      g.globalAlpha = 0.25 + 0.45 * pulse;
      fillRR(b.x - 1.2, y - 1.2, b.w + 2.4, LAY.btnH + 2.4, 6.2, '#ffd23f');
      g.globalAlpha = 1;
    }
    fillRR(b.x, y + 1.2, b.w, LAY.btnH, 5, '#4a2a10');
    fillRR(b.x, y, b.w, LAY.btnH, 5, sel ? '#fff7c2' : (live || Game.mode === 'title' ? '#fff' : '#d8cdb8'), sel ? '#ffb300' : (waiting ? '#ffb300' : '#7a4a22'), sel ? 1.5 : (waiting ? 1.1 : 0.6));
    g.globalAlpha = live || sel || Game.mode === 'title' ? 1 : 0.75;
    circle(b.x + b.w / 2, y + 10, 7, HAND_COL[h]);
    g.font = (11 * S) + 'px ' + FONT; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#000';
    g.fillText(HAND_ICON[h], sx(b.x + b.w / 2), sy(y + 10.4));
    txt(HAND_NAME[h], b.x + b.w / 2, y + 21.5, 4.6, '#4a2a10');
    g.globalAlpha = 1;
  }
}

function drawCallText(nowT) {
  if (Game.mode !== 'match') return;
  if (Game.phase === 'call') {
    const k = clamp((nowT - Game.phaseT0) / 0.12, 0, 1);
    txt(Game.callText, 50, 80, 12 + 3 * (1 - k), '#fff', { stroke: '#c62828', sw: 2.4 });
  } else if (Game.phase === 'draw' || (Game.phase === 'grab' && nowT - Game.ponT < 0.35)) {
    txt(Game.callText, 50, 80, 10, '#fff', { stroke: '#c62828', sw: 2 });
  }
}
// ===== 効果音（WebAudio で合成。音声ファイルなし・BGMなし）=====
const Snd = (() => {
  let ac = null, master = null, noiseBuf = null;
  function init() {
    if (!ac) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ac = new AC();
        const comp = ac.createDynamicsCompressor();
        comp.threshold.value = -14; comp.ratio.value = 6;
        master = ac.createGain(); master.gain.value = 0.55;
        master.connect(comp); comp.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (_) { ac = null; return; }
    }
    if (ac.state === 'suspended') ac.resume();
  }
  const now = () => ac.currentTime;
  function tone(f, dur, o) {
    if (!ac) return;
    o = o || {};
    const t0 = now() + (o.delay || 0);
    const osc = ac.createOscillator(), gn = ac.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t0);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, f * o.slide), t0 + dur);
    const v = o.vol == null ? 0.4 : o.vol;
    gn.gain.setValueAtTime(0.0001, t0);
    gn.gain.exponentialRampToValueAtTime(v, t0 + 0.006);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gn); gn.connect(master);
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  }
  function noise(dur, o) {
    if (!ac) return;
    o = o || {};
    const t0 = now() + (o.delay || 0);
    const src = ac.createBufferSource(); src.buffer = noiseBuf;
    const fl = ac.createBiquadFilter(); fl.type = o.type || 'bandpass';
    fl.frequency.setValueAtTime(o.f || 1200, t0); fl.Q.value = o.q || 1;
    if (o.sweep) fl.frequency.exponentialRampToValueAtTime(o.sweep, t0 + dur);
    const gn = ac.createGain(); gn.gain.setValueAtTime(o.vol || 0.3, t0); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(fl); fl.connect(gn); gn.connect(master);
    src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.02);
  }
  return {
    init,
    // 合図：ジャン・ケン（同じ高さ）→ ポン（高い）
    call(idx, aiko) { const f = aiko ? 740 : 660; tone(f, 0.12, { type: 'triangle', vol: 0.4 }); },
    pon() { tone(990, 0.2, { type: 'triangle', vol: 0.5 }); tone(1980, 0.12, { type: 'sine', vol: 0.16 }); },
    select(h) { tone([523, 659, 784][h] || 600, 0.08, { type: 'square', vol: 0.12 }); },
    tapItem() { noise(0.04, { f: 2200, q: 2, vol: 0.2 }); },
    draw() { tone(330, 0.16, { type: 'sine', vol: 0.3 }); tone(330, 0.16, { type: 'sine', vol: 0.3, delay: 0.14 }); },
    // 叩いた「ピコッ」
    pico(big) {
      tone(900, 0.09, { type: 'square', vol: 0.3, slide: 0.55 });
      tone(1500, 0.07, { type: 'sine', vol: 0.3, delay: 0.05, slide: 1.4 });
      if (big) noise(0.08, { f: 1800, q: 1.5, vol: 0.2, delay: 0.02 });
    },
    // 叩かれた
    pico2() { tone(500, 0.12, { type: 'square', vol: 0.34, slide: 0.4 }); noise(0.12, { f: 600, vol: 0.34 }); tone(110, 0.2, { type: 'sine', vol: 0.4, slide: 0.5 }); },
    // ガード「コン」
    guard() { tone(420, 0.1, { type: 'triangle', vol: 0.55, slide: 0.7 }); noise(0.03, { f: 3500, q: 3, vol: 0.3 }); },
    // 反則（ブー）
    foul() { tone(130, 0.5, { type: 'sawtooth', vol: 0.3 }); tone(138, 0.5, { type: 'sawtooth', vol: 0.25 }); },
    whiff() { tone(300, 0.2, { type: 'sine', vol: 0.3, slide: 0.6 }); },
    win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, { type: 'triangle', vol: 0.4, delay: i * 0.1 })); },
    lose() { [392, 330, 262].forEach((f, i) => tone(f, 0.28, { type: 'triangle', vol: 0.4, delay: i * 0.16 })); }
  };
})();
// ===== 操作・ループ・結果 =====
const BEST_KEY = 'tataite-kabutte-best-v2';   // { r: 到達（優勝 = 6）, f: 最速の反応 }
function loadBest() { try { const v = JSON.parse(localStorage.getItem(BEST_KEY)); return v && typeof v === 'object' ? v : {}; } catch (_) { return {}; } }
function saveBest(v) { try { localStorage.setItem(BEST_KEY, JSON.stringify(v)); } catch (_) {} }

let shownResult = false, lastNow = 0, overAt = 0;
const nowSec = () => performance.now() / 1000;
// pointerdown の時刻（performance.now と同じ時計）。おかしい値のときは今の時刻
function evTime(e) {
  const n = performance.now(), t = e.timeStamp;
  return (t > 0 && Math.abs(n - t) < 2000 ? t : n) / 1000;
}

function pickHand(h, t) {
  pressT[h] = 0.15;
  if (Game.selectHand(h, t)) Snd.select(h);
}
function pickItem(which, t) {
  if (Game.tapItem(which, t)) { itemPress[which] = 0.15; Snd.tapItem(); }
  else itemPress[which] = 0.08;   // 無効なときも小さく動く（反応なしにしない）
}

function startOrRetry(t) {
  Game.reset();
  shownResult = false;
  popups.length = 0; parts.length = 0; react = null; faceT = 0; shakeT = 0; flashT = 0;
  $('result').classList.remove('show', 'wait');
  Game.begin(t);
}

function bindUI() {
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    Snd.init();
    const t = evTime(e);
    if (Game.mode === 'title') { startOrRetry(t); return; }
    if (Game.mode !== 'match') return;
    const p = toLogic(e.clientX, e.clientY);
    // 手のボタン
    if (p.y >= LAY.btnY - 2) {
      for (let h = 0; h < 3; h++) {
        const b = LAY.btns[h];
        if (p.x >= b.x - 1 && p.x <= b.x + b.w + 1) { pickHand(h, t); return; }
      }
      return;
    }
    // 道具（広めに取る）
    if (p.y >= LAY.hammer.y - 4 && p.y < LAY.btnY - 2) {
      pickItem(p.x < 50 ? 'hammer' : 'helmet', t);
    }
  });
  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    const k = e.key, t = evTime(e);
    if (Game.mode === 'title') {
      if (k === '1' || k === '2' || k === '3' || k === ' ' || k === 'Enter' || k === 'ArrowLeft' || k === 'ArrowRight') { e.preventDefault(); Snd.init(); startOrRetry(t); }
      return;
    }
    if (Game.mode === 'over') {
      if ((k === ' ' || k === 'Enter') && !$('result').classList.contains('wait')) { e.preventDefault(); Snd.init(); startOrRetry(t); }
      return;
    }
    if (k === '1' || k === '2' || k === '3') { e.preventDefault(); pickHand(+k - 1, t); }
    else if (k === 'ArrowLeft') { e.preventDefault(); pickItem('hammer', t); }
    else if (k === 'ArrowRight') { e.preventDefault(); pickItem('helmet', t); }
  });
  window.addEventListener('resize', resize);
  window.addEventListener('contextmenu', e => e.preventDefault());
  $('retry').addEventListener('click', () => { Snd.init(); startOrRetry(nowSec()); });
}

function showResult() {
  shownResult = true;
  const champ = Game.tourney === 'champion';
  const reach = champ ? CFG.opps.length + 1 : Game.oppIdx + 1;     // 優勝は 6
  $('rHead').textContent = champ ? '優勝！' : roundLabel(Game.oppIdx) + 'で 敗退…';
  $('rSub').textContent = champ ? '町内 叩いて被って大会' : Game.opp.name + 'に 敗れた';
  $('rFast').textContent = Game.fastest != null ? Game.fastest.toFixed(2) + ' 秒' : '—';
  $('rHits').textContent = Game.stats.hits;
  $('rFouls').textContent = Game.stats.fouls;
  const best = loadBest();
  const nb = { r: Math.max(best.r || 0, reach), f: Game.fastest != null && (!best.f || Game.fastest < best.f) ? Game.fastest : best.f };
  const newReach = reach > (best.r || 0) && (best.r || 0) > 0, newFast = Game.fastest != null && best.f && Game.fastest < best.f - 1e-9;
  saveBest(nb);
  const lab = r => r > CFG.opps.length ? '優勝' : roundLabel(r - 1);
  $('rBest').textContent = (newReach || newFast ? 'ベスト こうしん！　' : '') + '自己ベスト ' + lab(nb.r) + (nb.f ? '・最速 ' + nb.f.toFixed(2) + ' 秒' : '');
  const el = $('result');
  el.classList.add('show', 'wait');   // 指が離れる前にボタンを押してしまわないように、少しの間は触れない
  setTimeout(() => el.classList.remove('wait'), 700);
}

// ロジックの出来事 → 音と動き
function reactToEvents() {
  for (const e of Game.events) {
    if (e.type === 'start') {
      $('title').classList.add('hide');
      react = null;
    } else if (e.type === 'nextOpp') {
      Snd.win();
      addPopup(roundLabel(e.idx), 50, 78, 13, '#ffd23f', 1.6);
      faceT = 0; react = null;
    } else if (e.type === 'call') {
      Snd.call(e.idx, e.aiko);
      react = null;
    } else if (e.type === 'pon') {
      Snd.pon();
    } else if (e.type === 'draw') {
      Snd.draw();
      addPopup('あいこ', 50, 80, 11, '#fff', 0.7);
    } else if (e.type === 'cpuTake') {
      Snd.tapItem();
    } else if (e.type === 'tap') {
      react = { sec: e.react, praise: e.praise, correct: e.correct };
    } else if (e.type === 'outcome') {
      onOutcome(e);
    } else if (e.type === 'over') {
      overAt = nowSec();
    }
  }
  Game.events.length = 0;
}

function onOutcome(e) {
  const f = LAY.face;
  switch (e.outcome) {
    case 'hit':
      Snd.pico(true); shake(2.2, 0.25); flash('#fff', 0.2);
      burst(f.x, f.y, '#ffd23f', 14, 40, 0.7, true);
      addPopup('ピコッ！', 50, 78, 14, '#ffd23f', 1.1);
      faceMood = 'dizzy'; faceT = 1.4; break;
    case 'cpuFoul':
      Snd.foul(); Snd.pico(false);
      burst(f.x, f.y, '#ffd23f', 10, 34, 0.6, true);
      addPopup('相手の反則！', 50, 78, 10, '#ffd23f', 1.2);
      faceMood = 'dizzy'; faceT = 1.4; break;
    case 'guarded':
      Snd.guard(); burst(f.x, f.y - 8, '#9bd0ff', 8, 28, 0.5);
      addPopup('ガードされた！', 50, 78, 10, '#9bd0ff', 1.1);
      faceMood = 'grin'; faceT = 1.2; break;
    case 'wrongHelmet':
      Snd.whiff(); addPopup('勝ったのに…', 50, 78, 9, '#e8e0d0', 1.1);
      faceMood = 'huh'; faceT = 1.4; break;
    case 'guard':
      Snd.guard(); burst(50, 100, '#9bd0ff', 10, 30, 0.5);
      addPopup('ナイスガード！', 50, 78, 11, '#9bd0ff', 1.1); flash('#9bd0ff', 0.15);
      faceMood = 'sweat'; faceT = 1.2; break;
    case 'cpuHit':
      Snd.pico2(); shake(4.5, 0.4); flash('#ff6b6b', 0.25);
      burst(50, 95, '#ffd23f', 14, 44, 0.8, true);
      addPopup(e.timeout ? 'ぼーっとしてた！' : 'ピコッ！', 50, 78, e.timeout ? 9 : 14, '#ff6b6b', 1.1);
      faceMood = 'grin'; faceT = 1.4; break;
    case 'foul':
      Snd.foul(); shake(4, 0.35); flash('#ff3b3b', 0.3);
      burst(50, 95, '#ffd23f', 12, 40, 0.7, true);
      addPopup('反則！', 50, 78, 14, '#ff6b6b', 1.2);
      faceMood = 'grin'; faceT = 1.4; break;
    case 'nothing':
      Snd.whiff(); addPopup('…', 50, 78, 9, '#e8e0d0', 0.9); break;
  }
  if (e.matchResult === 'lose') setTimeout(() => Snd.lose(), 500);
  else if (e.matchResult === 'win' && e.oppIdx === CFG.opps.length - 1) setTimeout(() => Snd.win(), 500);
}

function frame() {
  const nt = nowSec();
  const dt = lastNow ? Math.min(nt - lastNow, 0.1) : 0;
  lastNow = nt;
  Game.advanceTo(nt);
  reactToEvents();
  if (Game.mode === 'over' && !shownResult && nt - overAt > CFG.overDelay) showResult();
  updateVisual(dt);
  render(nt);
  requestAnimationFrame(frame);
}
Game.reset();
resize();
bindUI();
requestAnimationFrame(frame);
</script>
