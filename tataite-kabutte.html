<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>叩いて被ってジャンケンポン（仮）</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1a14;
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif;color:#fff;
  user-select:none;-webkit-user-select:none;touch-action:none;
  word-break:auto-phrase;line-break:strict;text-wrap:balance}
body{display:flex;align-items:center;justify-content:center}
/* 文節の途中で改行しない：短い言葉は nb（折り返さない）、長い文は文節ごとに ph で包む */
.nb{display:inline-block;white-space:nowrap}
.ph{display:inline-block}

#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* 遊ぶ場所の枠（縦9:16で中央）。単位は cqw（枠の幅の1%）。触れるのは下の絵 */
#stage{position:relative;container-type:size;
  width:min(100vw,calc(100dvh*9/16));aspect-ratio:9/16;pointer-events:none}

/* タイトル */
#title{position:absolute;left:5cqw;right:5cqw;top:26cqw;z-index:20;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:3cqw}
#title.hide{display:none}
#title .t1{font-size:4.6cqw;font-weight:bold;color:#fff;background:#e23b3b;border-radius:5cqw;padding:.8cqw 4.5cqw;letter-spacing:.4cqw;box-shadow:0 .8cqw 0 #8f1f1f;white-space:nowrap}
#title .t2{font-size:12cqw;font-weight:900;line-height:1.15;color:#ffd23f;
  -webkit-text-stroke:1.4cqw #7a1a1a;paint-order:stroke fill;text-shadow:0 1.4cqw 0 #7a1a1a,0 2.2cqw 3cqw #0008}
#title .t4{margin-top:3cqw;font-size:6cqw;font-weight:bold;color:#fff;background:#e0562a;border-radius:6cqw;white-space:nowrap;
  padding:2cqw 8cqw;box-shadow:0 1.2cqw 0 #8f2f12;animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{transform:scale(1.07)}}

/* 結果（優勝は賞状、敗退はトーナメント表）。はみ出すときは safe center で上から読める */
#result{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;
  justify-content:safe center;overflow:auto;padding:4.5cqw 5cqw 5cqw;gap:2.6cqw;pointer-events:auto;touch-action:pan-y;
  background:rgba(60,12,12,.38);-webkit-overflow-scrolling:touch}
#result.show{display:flex;animation:fadein .3s ease-out}
#result.wait .btn,#result.wait .xbtn{pointer-events:none}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.7) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
#result>*{flex:none;width:100%}
.hide{display:none!important}
.dbg *{animation:none!important}

/* 賞状 */
.cert{position:relative;text-align:center;color:#5a2a10;background:#fffbea;border:1.6cqw double #b8860b;
  box-shadow:0 2cqw 0 #00000044,0 3cqw 6cqw #0008;padding:4cqw 3cqw 4.4cqw;animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
.cert::before{content:"";position:absolute;inset:1.2cqw;border:.4cqw solid #e23b3b99;pointer-events:none}
.cert .c-top{font-size:5.4cqw;letter-spacing:3cqw;padding-left:3cqw;font-weight:bold;color:#7a1a1a}
.cert .c-big{font-size:25cqw;font-weight:900;line-height:1.05;color:#ffc21a;white-space:nowrap;
  -webkit-text-stroke:1.2cqw #7a1a1a;paint-order:stroke fill;text-shadow:0 1.2cqw 0 #7a1a1a}
.cert .c-sub{font-size:5.6cqw;font-weight:bold;color:#7a1a1a;margin-top:1cqw}
.cert .c-line{margin-top:3cqw;font-size:4.6cqw;display:flex;justify-content:center;align-items:baseline;gap:2cqw;white-space:nowrap}
.cert .c-line b{font-size:8.4cqw;color:#e23b3b}
.cert .c-line i{font-style:normal;font-weight:bold;color:#b8860b;font-size:5cqw}
.cert .seal{position:absolute;right:3.4cqw;top:3cqw;width:11cqw;height:11cqw;border-radius:50%;border:.8cqw solid #d22;color:#d22;
  display:grid;place-items:center;font-size:4.6cqw;font-weight:900;transform:rotate(-12deg);background:#fff0;line-height:1;opacity:.85}

/* トーナメント表 */
.bracket{background:#fff7e6;border:.8cqw solid #e23b3b;border-radius:3.5cqw;padding:3cqw 4cqw 3.4cqw;color:#4a2a10;
  box-shadow:0 2cqw 0 #00000044,0 3cqw 6cqw #0008;animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
.b-hd{font-size:7.4cqw;font-weight:900;color:#e23b3b;text-align:center;line-height:1.2;white-space:nowrap}
.b-tt{font-size:3.4cqw;text-align:center;color:#7a4a22;margin-top:.4cqw;white-space:nowrap}
.b-rows{list-style:none;margin:2.4cqw 0 0;padding:0;position:relative}
.b-rows::before{content:"";position:absolute;left:2.6cqw;top:3.6cqw;bottom:3.6cqw;width:.7cqw;background:#c9a27a;border-radius:1cqw}
.b-rows li{display:flex;align-items:center;gap:2.4cqw;height:7.4cqw;font-size:4.2cqw;position:relative;white-space:nowrap;border-radius:2cqw;padding-right:2cqw;color:#9a8a76}
.b-rows .dot{position:relative;z-index:1;flex:none;width:5.6cqw;height:5.6cqw;border-radius:50%;border:.5cqw solid #b9a98c;background:#eee6d6;display:grid;place-items:center;font-size:3.2cqw;font-weight:900;line-height:1;color:#fff}
.b-rows .rl{width:12.4cqw;font-weight:bold;flex:none}
.b-rows .rn{flex:1;overflow:hidden}
.b-rows .rs{font-weight:bold;font-size:3.4cqw}
.b-rows li.ok{color:#4a2a10}
.b-rows li.ok .dot{background:#ffc21a;border-color:#b8860b}
.b-rows li.ok .rs{color:#b8860b}
.b-rows li.lost{color:#7a1a1a;background:#ffe0dc}
.b-rows li.lost .dot{background:#e23b3b;border-color:#8f1f1f}
.b-rows li.lost .rs{color:#e23b3b}
.taunt{display:flex;align-items:center;gap:3cqw;margin-top:2.8cqw}
#oppIcon{width:21cqw;height:21cqw;flex:none;border-radius:50%;background:#ffe7bd;border:.7cqw solid #7a4a22}
.bubble{position:relative;flex:1;background:#fff;border:.6cqw solid #7a4a22;border-radius:3cqw;padding:2cqw 3cqw;font-size:4.2cqw;line-height:1.45;text-align:left;color:#4a2a10}
.bubble::before{content:"";position:absolute;left:-2.6cqw;top:50%;margin-top:-1.8cqw;border:1.8cqw solid transparent;border-right:2.4cqw solid #7a4a22;border-left:0}
.bubble::after{content:"";position:absolute;left:-1.6cqw;top:50%;margin-top:-1.4cqw;border:1.4cqw solid transparent;border-right:2cqw solid #fff;border-left:0}
.bubble .who{display:block;font-size:3cqw;color:#9a6a3a;white-space:nowrap}

/* 数字 */
.tiles{display:flex;gap:2cqw}
.tile{flex:1;background:#fff7e6;border:.5cqw solid #c9a27a;border-radius:2.6cqw;padding:1.6cqw 1cqw 1.8cqw;text-align:center;color:#4a2a10;box-shadow:0 1cqw 0 #00000033}
.tile>span{display:block;font-size:3.2cqw;color:#7a4a22;white-space:nowrap}
.tile b{display:block;font-size:5.8cqw;white-space:nowrap}
#rBest .ph{margin:0 1.4cqw}
#rBest{font-size:3.8cqw;color:#fff;text-align:center;text-shadow:0 .3cqw 1cqw #000a;min-height:5cqw}
.row{display:flex;gap:3cqw;align-items:center;margin-top:.4cqw}
.btn{border:0;border-radius:3.6cqw;font:inherit;font-weight:bold;color:#fff;cursor:pointer;white-space:nowrap;
  background:linear-gradient(#ff8a3d,#e0562a);box-shadow:0 1.2cqw 0 #8f2f12;touch-action:manipulation}
.btn:active{transform:translateY(.8cqw);box-shadow:0 .4cqw 0 #8f2f12}
#retry{flex:1;height:14cqw;font-size:6cqw}
.xwrap{display:flex;justify-content:center}
.xbtn{display:inline-flex;align-items:center;gap:1.4cqw;border:0;border-radius:99cqw;background:#15171a;color:#fff;font:inherit;font-weight:bold;
  font-size:3.8cqw;padding:1.7cqw 4.4cqw;cursor:pointer;white-space:nowrap;opacity:.92;touch-action:manipulation}
.xbtn:active{opacity:.7}
.xbtn .xm{font-family:Arial,sans-serif;font-weight:900;font-size:4.4cqw;line-height:1}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="stage">
  <div id="title">
    <div class="t1">町内の 叩いて被って大会</div>
    <div class="t2"><span class="nb">叩いて</span><span class="nb">被って</span><span class="nb">ジャンケンポン</span></div>
    <div class="t4">タップで スタート</div>
  </div>
  <div id="result">
    <div class="cert hide" id="cert">
      <div class="c-top">賞状</div>
      <div class="c-big">優勝</div>
      <div class="c-sub"><span class="ph">町内</span> <span class="ph">叩いて被って大会</span></div>
      <div class="c-line"><span>最速の反応</span><b id="cFast"></b><i id="cPraise"></i></div>
      <div class="seal">町内<br>会</div>
    </div>
    <div class="bracket hide" id="bracket">
      <div class="b-hd" id="bHead"></div>
      <div class="b-tt">町内 叩いて被って大会　トーナメント</div>
      <ol class="b-rows" id="bRows"></ol>
      <div class="taunt">
        <canvas id="oppIcon" width="160" height="160"></canvas>
        <div class="bubble"><span class="who" id="tWho"></span><span id="tText"></span></div>
      </div>
    </div>
    <div class="tiles">
      <div class="tile"><span>最速の反応</span><b id="rFast"></b></div>
      <div class="tile"><span>叩いた回数</span><b><span id="rHits">0</span> 回</b></div>
      <div class="tile"><span>反則の回数</span><b><span id="rFouls">0</span> 回</b></div>
    </div>
    <div id="rBest"></div>
    <div class="row"><button id="retry" class="btn">もう一回</button></div>
    <div class="xwrap"><button id="share" class="xbtn"><span class="xm">X</span><span>で シェア</span></button></div>
  </div>
</div>
<script>
// ===== 調整用の数値（遊びながらここを触る）=====
// 論理座標：幅 100 × 高さ 177.8（9:16）。時間の単位はすべて秒。
const CFG = {
  W: 100, H: 177.8,
  // --- 合図のテンポ（手を選ぶまでは待つ。選んだ瞬間から「ジャン」が始まる）---
  readyT: 0.7,        // 試合の最初の間（実況が出る）
  nextOppT: 1.0,      // 次の相手に変わるときの、さらに追加の間
  gapT: 0.4,          // 1 回のあと、手を選べるようになるまで（この間に前もって選んでもよい）
  janT: 0.4,          // 「ジャン」の長さ（手は選び直せる）
  kenT: 0.4,          // 「ケン」の長さ（手は選び直せる）
  aikoCall: 0.5,      // あいこのとき「あいこで」の長さ（これが終わると「しょ」で手が出る）
  drawHold: 0.7,      // あいこの手を見せておく間
  grabTimeout: 1.5,   // 「ポン」から何も取らないままこの時間が過ぎると決着
  resultHold: 1.2,    // 決着を見せておく間
  // --- 試合 ---
  winPoints: 2,       // 先取の本数（長すぎれば 1 にする）
  // --- 反応の秒数のほめ言葉（以下ならその言葉。小さい順。人間の「見て・判断して・タップ」の目安に合わせる）---
  praise: [[0.45, '神速'], [0.60, '速い'], [0.80, 'いいね']],
  // --- 相手（回戦の順。最後が決勝）---
  //  mean: 反応の平均（人間が出せる速さ。min は 0.40 秒以上＝それより速くは反応しない） / spread: ばらつき（標準偏差。大きめにして、速さの差がそのまま勝ち負けにならないようにする）/ mistake: 取り違える確率 / min: これより速くは反応しない
  //  habit: ジャンケンのクセ { type, s: クセの強さ（その手を出す確率。外れたら 3 つから気まぐれ） }
  //    type: goo グーが多い / loser 前回負けた手に勝つ手 / repeat 同じ手を続ける / none ばらばら / counter こちらの前回の手に勝つ手
  //    s = 0.5 だと実際にクセの手が出る割合は約 67%
  opps: [
    { name: '近所の小学生',     mean: 0.98, spread: 0.24, mistake: 0.12, min: 0.50, habit: { type: 'goo',     s: 0.5 }, taunt: 'へへーん！|ぼくの|勝ちー！' },
    { name: '学級委員長',       mean: 0.86, spread: 0.24, mistake: 0.09, min: 0.46, habit: { type: 'loser',   s: 0.5 }, taunt: '練習不足ですよ。|出直して|きなさい。' },
    { name: '体育の先生',       mean: 0.75, spread: 0.24, mistake: 0.08, min: 0.43, habit: { type: 'repeat',  s: 0.5 }, taunt: '反応が遅い！|腕立て|三十回だ！' },
    { name: '商店街のおばあちゃん', mean: 0.73, spread: 0.24, mistake: 0.08, min: 0.42, habit: { type: 'none',    s: 0 }, taunt: 'あらあら、|飴ちゃん食べて|元気だしなさい。' },
    { name: '町内チャンピオン', mean: 0.58, spread: 0.24, mistake: 0.05, min: 0.40, habit: { type: 'counter', s: 0.5 }, taunt: 'その程度では|町内の頂点には|届かんな。' }
  ],
  overDelay: 0.5      // 勝ち抜き戦が終わってから結果を出すまで（UI 側。ロジックの resultHold のあと）
};
// ===== ゲームのロジック（画面を使わない。時刻は秒で明示的に渡す）=====
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 手：0 グー・1 チョキ・2 パー（グー＞チョキ＞パー＞グー）
const HAND_NAME = ['グー', 'チョキ', 'パー'];
const HAND_ICON = ['✊', '✌️', '✋'];
// a から見た b との勝ち負け
function rpsOf(a, b) {
  if (a === b) return 'draw';
  return ((b - a + 3) % 3 === 1) ? 'win' : 'lose';
}
// 反応の秒数 → ほめ言葉（なければ ''）
function praiseOf(sec) {
  for (const [lim, word] of CFG.praise) if (sec <= lim) return word;
  return '';
}

// 実況の一言
const COMM = {
  hit: '決まった！', guarded: 'ガード！', wrongHelmet: 'あれ？被っちゃった',
  cpuHit: '叩かれた！', guard: 'ナイスガード！', foul: 'おっと、反則です！', cpuFoul: '相手の反則！', nothing: '…様子見'
};

// 1 回の決着を決める純粋な関数（表の全部の行がここ）。時刻はすべて「ポン」からの秒数。
//   rps: 自分から見た 'win' | 'lose'
//   pItem: 自分が最初に取った道具 'hammer' | 'helmet' | null（取らなかった）、pT: その時刻
//   cItem / cT: 相手が取る道具と時刻（「ポン」の時点で決めておく）
// 返り値 { type, point('p' 自分 | 'c' 相手 | null), at }
//   type: hit 叩いた / guarded ガードされた / wrongHelmet 勝ったのに被った / cpuHit 叩かれた /
//         guard ガード成功 / foul 反則（負けたのにハンマー）/ cpuFoul 相手の反則 / nothing 何もなし
// 同時刻は守る側（ヘルメット）を優先する。
function resolveRound(rps, pItem, pT, cItem, cT, timeout) {
  // 相手が自分だけで決める出来事（相手がハンマーを取ったとき）
  let auto = null;
  if (cItem === 'hammer') {
    auto = rps === 'lose' ? { type: 'cpuHit', point: 'c', at: cT } : { type: 'cpuFoul', point: 'p', at: cT };
  }
  // 自分の出来事
  let pe = null;
  if (pItem === 'hammer') {
    if (rps === 'lose') pe = { type: 'foul', point: 'c', at: pT };
    else if (cItem === 'helmet' && cT <= pT) pe = { type: 'guarded', point: null, at: pT };
    else pe = { type: 'hit', point: 'p', at: pT };
  } else if (pItem === 'helmet') {
    if (rps === 'win') pe = { type: 'wrongHelmet', point: null, at: pT };
    else pe = { type: 'guard', point: null, at: pT };
  }
  if (pe && auto) {
    // 早い方。同時刻は自分（ヘルメットのガード）を先にする
    return auto.at < pe.at ? auto : pe;
  }
  if (pe) return pe;
  if (auto) return auto;
  // どちらも取らないまま時間切れ
  return rps === 'lose' ? { type: 'cpuHit', point: 'c', at: timeout, timeout: true } : { type: 'nothing', point: null, at: timeout, timeout: true };
}

// a に勝つ手
const winHand = h => (h + 2) % 3;
// 回戦の名前（最後は決勝）
function roundLabel(i) { return i === CFG.opps.length - 1 ? '決勝' : (i + 1) + '回戦'; }

// 相手のクセが「いま出したがっている手」（クセを読んだときの答え）。なければ null
//   goo: いつもグー寄り / loser: 前回負けた手に勝つ手 / repeat: 同じ手を続ける
//   counter: こちらの前回の手に勝つ手 / none: ばらばら
// hist は直前までの手の記録 [{ p: 自分の手, c: 相手の手 }]（この相手との試合の中だけ）
function habitHandOf(opp, hist) {
  const hb = opp.habit;
  if (!hb) return null;
  const last = hist[hist.length - 1];
  switch (hb.type) {
    case 'goo': return 0;
    case 'repeat': return last ? last.c : null;
    case 'loser': {
      if (!last) return null;
      const r = rpsOf(last.p, last.c);
      if (r === 'draw') return null;
      return winHand(r === 'win' ? last.c : last.p);
    }
    case 'counter': return last ? winHand(last.p) : null;
    default: return null;
  }
}

const Game = {
  mode: 'title',        // title → match（勝ち抜き戦の全体）→ over
  phase: '',            // ready → wait（手を選ぶのを待つ）→ call → grab → result → ready … / あいこ: draw → wait …
  time: 0, endT: 0, phaseT0: 0,
  seed: 1, rand: null,
  events: [],

  reset(seed) {
    this.seed = seed == null ? (Date.now() & 0xffffff) : seed;
    this.rand = mulberry32(this.seed);
    this.mode = 'title'; this.phase = ''; this.time = 0; this.endT = 0; this.phaseT0 = 0;
    this.oppIdx = 0; this.opp = CFG.opps[0];
    this.score = { p: 0, c: 0 };
    this.matchResult = '';         // いまの相手との試合：'win' | 'lose'
    this.tourney = '';             // 勝ち抜き戦の結果：'champion' | 'out'
    this.comm = '';
    this.hist = [];                // この相手との試合で出した手の記録 { p, c }
    this.fastest = null;           // 通しての最速（正しい道具を取ったときだけ）
    this.stats = { hits: 0, fouls: 0, guards: 0, wrong: 0 };
    this.clearRound();
    this.events = [];
  },

  clearRound() {
    this.aiko = false; this.callIdx = 0; this.callText = '';
    this.chosen = null;
    this.pHand = null; this.cHand = null; this.rps = '';
    this.ponT = 0; this.cpuDone = false;
    this.cItem = null; this.cReact = 0; this.cMistake = false;
    this.pItem = null; this.pReact = null; this.pCorrect = false; this.pPraise = '';
    this.outcome = ''; this.point = null; this.resolveT = 0;
  },

  emit(e) { e.t = this.time; this.events.push(e); },
  enter(phase, t, dur) { this.phase = phase; this.phaseT0 = t; this.endT = t + dur; },

  // タイトルのタップ。すぐ 1 回戦が始まる
  begin(t) {
    if (this.mode !== 'title') return false;
    this.time = Math.max(this.time, t || 0);
    this.mode = 'match';
    this.oppIdx = 0;
    this.fastest = null;
    this.stats = { hits: 0, fouls: 0, guards: 0, wrong: 0 };
    this.tourney = '';
    this.beginOpp(this.time, CFG.readyT, 'start');
    return true;
  },

  // 相手との試合を始める（最初の相手も、次の相手もここ）
  beginOpp(t, dur, evType) {
    this.opp = CFG.opps[this.oppIdx];
    this.score = { p: 0, c: 0 };
    this.matchResult = '';
    this.hist = [];
    this.clearRound();
    this.comm = roundLabel(this.oppIdx) + '、はじめ';
    this.enter('ready', t, dur);
    this.emit({ type: evType, idx: this.oppIdx });
  },

  // 手を選ぶのを待つ（時間制限なし）。選んだ時刻から「ジャン」が始まる
  startWait(t) {
    this.phase = 'wait'; this.phaseT0 = t; this.endT = Infinity;
    this.emit({ type: 'wait', aiko: this.aiko });
  },

  startCall(t) {
    this.callIdx = 0;
    this.callText = this.aiko ? 'あいこで' : 'ジャン';
    this.enter('call', t, this.aiko ? CFG.aikoCall : CFG.janT);
    this.emit({ type: 'call', idx: 0, text: this.callText, aiko: this.aiko });
  },

  // 時刻 t まで進める。strict のときは t ちょうどの出来事は先に処理しない（同時は守る側が勝つため）
  advanceTo(t, strict) {
    if (!isFinite(t)) return;
    if (this.mode === 'match') {
      for (let guard = 0; guard < 1000; guard++) {
        let evT = this.endT, kind = 'phase';
        if (this.phase === 'grab' && !this.cpuDone) {
          const ct = this.ponT + this.cReact;
          if (ct <= evT) { evT = ct; kind = 'cpu'; }
        }
        if (strict ? evT >= t : evT > t) break;
        this.time = Math.max(this.time, evT);
        if (kind === 'cpu') this.cpuEvent(evT); else this.phaseEnd();
        if (this.mode !== 'match') break;
      }
    }
    this.time = Math.max(this.time, t);
  },

  phaseEnd() {
    const t = this.endT;
    switch (this.phase) {
      case 'ready':
        if (this.chosen != null) this.startCall(t);   // 前もって選んでいたらすぐ「ジャン」
        else this.startWait(t);
        break;
      case 'call':
        if (!this.aiko && this.callIdx === 0) {
          this.callIdx = 1; this.callText = 'ケン';
          this.enter('call', t, CFG.kenT);
          this.emit({ type: 'call', idx: 1, text: 'ケン', aiko: false });
        } else this.pon(t);
        break;
      case 'draw':
        this.clearRound(); this.aiko = true;
        this.startWait(t);
        break;
      case 'grab':   // 時間切れ
        if (!this.outcome) this.finish(resolveRound(this.rps, this.pItem, this.pReact, this.cItem, this.cReact, CFG.grabTimeout), t);
        break;
      case 'result':
        if (this.matchResult === 'win' && this.oppIdx < CFG.opps.length - 1) {
          this.oppIdx++;
          this.beginOpp(t, CFG.readyT + CFG.nextOppT, 'nextOpp');
        } else if (this.matchResult) {
          this.tourney = this.matchResult === 'win' ? 'champion' : 'out';
          this.mode = 'over'; this.phase = 'over';
          this.emit({ type: 'over', tourney: this.tourney });
        } else {
          this.clearRound();
          this.comm = '';
          this.enter('ready', t, CFG.gapT);
        }
        break;
    }
  },

  // 相手のジャンケンのクセ。クセの強さ s の確率でクセの手、外れたら気まぐれ（3 つから）
  pickCpuHand() {
    const r = this.rand;
    const a = r(), b = r();
    const h = habitHandOf(this.opp, this.hist);
    if (h != null && a < this.opp.habit.s) return h;
    return Math.floor(b * 3);
  },

  // 「ポン」（あいこのときは「しょ」）
  pon(t) {
    this.ponT = t;
    this.pHand = this.chosen != null ? this.chosen : 0;
    this.cHand = this.pickCpuHand();
    this.rps = rpsOf(this.pHand, this.cHand);
    this.hist.push({ p: this.pHand, c: this.cHand });
    this.callText = this.aiko ? 'しょ' : 'ポン';
    // 相手の反応は「ポン」の時点で決めておく
    const r = this.rand, o = this.opp;
    const z = (r() + r() + r() - 1.5) / 0.5;           // ほぼ正規分布（標準偏差 1）
    this.cReact = Math.round(clamp(o.mean + z * o.spread, o.min, CFG.grabTimeout - 0.1) * 1e6) / 1e6;
    this.cMistake = r() < o.mistake;
    this.cpuDone = false; this.pItem = null;
    this.emit({ type: 'pon', text: this.callText, aiko: this.aiko, pHand: this.pHand, cHand: this.cHand, rps: this.rps });
    if (this.rps === 'draw') {
      this.cItem = null;
      this.comm = 'あいこ';
      this.enter('draw', t, CFG.drawHold);
      this.emit({ type: 'draw' });
      return;
    }
    const cWins = this.rps === 'lose';                  // 相手が勝ったなら正解はハンマー
    this.cItem = (cWins !== this.cMistake) ? 'hammer' : 'helmet';
    this.comm = '';
    this.enter('grab', t, CFG.grabTimeout);
  },

  // 相手が道具を取る
  cpuEvent(t) {
    this.cpuDone = true;
    this.emit({ type: 'cpuTake', item: this.cItem, mistake: this.cMistake });
    if (this.cItem === 'hammer' && !this.outcome) {
      this.finish(resolveRound(this.rps, this.pItem, this.pReact, this.cItem, this.cReact, CFG.grabTimeout), t);
    }
  },

  // 手を選ぶ。待っているとき（wait）はここから「ジャン」が始まる。「ジャン」「ケン」の間は選び直せる。
  // 次の回の前の間（ready）に前もって選んでおくこともできる
  selectHand(h, t) {
    if (t != null) this.advanceTo(t, true);
    if (this.mode !== 'match') return false;
    if (this.phase === 'wait') {
      this.chosen = h;
      this.emit({ type: 'select', hand: h });
      this.startCall(Math.max(t == null ? this.time : t, this.time));
      return true;
    }
    if (this.phase === 'call' || this.phase === 'ready') {
      this.chosen = h;
      this.emit({ type: 'select', hand: h });
      return true;
    }
    return false;
  },

  // 道具をタップ（pointerdown の時刻 t で即判定）
  tapItem(which, t) {
    if (t == null) t = this.time;
    this.advanceTo(t, true);
    if (this.mode !== 'match' || this.phase !== 'grab' || this.pItem || this.outcome) return false;
    if (t < this.ponT) return false;                    // 「ポン」より前の分は無効
    const rel = Math.round((t - this.ponT) * 1e6) / 1e6;   // 浮動小数の誤差で同時刻がずれないように
    this.pItem = which; this.pReact = rel;
    this.pCorrect = (this.rps === 'win' && which === 'hammer') || (this.rps === 'lose' && which === 'helmet');
    this.pPraise = this.pCorrect ? praiseOf(rel) : '';
    if (this.pCorrect && (this.fastest == null || rel < this.fastest)) this.fastest = rel;
    this.emit({ type: 'tap', item: which, react: rel, correct: this.pCorrect, praise: this.pPraise });
    const r = resolveRound(this.rps, which, rel, this.cItem, this.cReact, CFG.grabTimeout);
    this.finish(r, this.ponT + r.at);
    return true;
  },

  finish(r, t) {
    this.time = Math.max(this.time, t);
    this.outcome = r.type; this.point = r.point; this.resolveT = t;
    if (r.point === 'p') this.score.p++;
    if (r.point === 'c') this.score.c++;
    if (r.type === 'hit') this.stats.hits++;
    if (r.type === 'foul') this.stats.fouls++;
    if (r.type === 'guard') this.stats.guards++;
    if (r.type === 'wrongHelmet') this.stats.wrong++;
    this.comm = COMM[r.type] || '';
    if (this.score.p >= CFG.winPoints) this.matchResult = 'win';
    else if (this.score.c >= CFG.winPoints) this.matchResult = 'lose';
    this.enter('result', t, CFG.resultHold);
    this.emit({ type: 'outcome', outcome: r.type, point: r.point, timeout: !!r.timeout, score: { p: this.score.p, c: this.score.c }, matchResult: this.matchResult, oppIdx: this.oppIdx });
  }
};
// ===== 描画の土台・会場・画面全体（Canvas 2D。画像ファイルなし）=====
const $ = id => document.getElementById(id);
const cv = $('cv'); let g = cv.getContext('2d');
const FONT = '"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif';
let S = 1, OX = 0, OY = 0, DPR = 1, vw = 0, vh = 0;
let shakeT = 0, shakeAmp = 0, flashT = 0, flashColor = '#fff';
const popups = [], parts = [], confetti = [];
const pressT = [0, 0, 0];          // 手のボタンを押したときの光り
const itemPress = { hammer: 0, hammerT: 0, helmet: 0 };
let react = null;                  // 直近の反応の秒数の表示 { sec, praise, correct }
let GALLERY = false;              // 見た目の確認用（debug）

// 見た目の状態（ロジックとは別。出来事に反応して動く）
const VS = {
  cpu: null,                       // 相手の反応 { kind, t0, lvl, final }
  ia: { hammer: null, helmet: null },   // 自分の道具の動き { t0, mode, pon }
  slam: null,                      // 相手の道具が来る動き { t0, kind, lvl }
  viewHelmetT: -9,                 // 自分がヘルメットを被った時刻
  introT: -9,                      // 相手が出てきた時刻
  starSky: false,                  // 最終戦で相手が星になった
  retT: { hammer: -9, helmet: -9 },// 道具が机に戻った時刻
  crowd: 0, murmur: 0,             // 会場の盛り上がり・ざわめき
  lastPhase: ''
};

// 画面の部品の位置（論理座標 幅 100 × 高さ 177.8）。タップの判定にも使う
const LAY = {
  face: { x: 50, y: 44, r: 11 },
  tableY: 68, floorY: 65,
  cpuHand: { x: 50, y: 78, size: 19 },
  myHand: { x: 50, y: 102, size: 19 },

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  vw = window.innerWidth; vh = window.innerHeight;
  cv.width = Math.round(vw * DPR); cv.height = Math.round(vh * DPR);
  S = Math.min(vw / CFG.W, vh / CFG.H) * DPR;
  OX = (cv.width - CFG.W * S) / 2; OY = (cv.height - CFG.H * S) / 2;
}
const sx = x => OX + x * S;
const sy = y => OY + y * S;
function view() { return { x0: -OX / S, x1: (cv.width - OX) / S, y0: -OY / S, y1: (cv.height - OY) / S }; }
// 画面の座標（clientX/Y）→ 論理座標
function toLogic(cx, cy) { return { x: (cx * DPR - OX) / S, y: (cy * DPR - OY) / S }; }

// 別のキャンバスに同じ絵を描く（結果カードの画像・結果の相手の顔）
function withCtx(canvas, scale, ox, oy, fn) {
  const sg = g, sS = S, sOX = OX, sOY = OY, scv = cv;
  g = canvas.getContext('2d'); S = scale; OX = ox; OY = oy;
  try { fn(); } finally { g = sg; S = sS; OX = sOX; OY = sOY; }
}

function addPopup(text, x, y, size, color, life) { popups.push({ text, x, y, size, color, life: life || 0.9, t: 0 }); }
function burst(x, y, color, n, speed, life, star) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.2832, v = (0.4 + Math.random() * 0.6) * (speed || 30);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 8, life: (life || 0.6) * (0.6 + Math.random() * 0.5), t: 0, color, size: 1.5 + Math.random() * 1.8, star: !!star, rot: Math.random() * 6 });
  }
}
function shake(amp, dur) { shakeAmp = amp; shakeT = dur; }
function flash(color, dur) { flashColor = color; flashT = dur; }
function startConfetti(n) {
  const v = view();
  const cols = ['#e23b3b', '#ffd23f', '#3d9bff', '#38c172', '#ff8ac0', '#fff'];
  for (let i = 0; i < n; i++) confetti.push({ x: v.x0 + Math.random() * (v.x1 - v.x0), y: v.y0 - Math.random() * 90, vx: (Math.random() - 0.5) * 14, vy: 18 + Math.random() * 24, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 9, w: 1.4 + Math.random() * 1.4, c: cols[i % cols.length], ph: Math.random() * 6 });
}

function updateVisual(dt, nowT) {
  shakeT = Math.max(0, shakeT - dt);
  flashT = Math.max(0, flashT - dt);
  for (let i = 0; i < 3; i++) pressT[i] = Math.max(0, pressT[i] - dt);
  itemPress.hammer = Math.max(0, itemPress.hammer - dt);
  itemPress.helmet = Math.max(0, itemPress.helmet - dt);
  VS.crowd = Math.max(0, VS.crowd - dt * 0.6);
  VS.murmur = Math.max(0, VS.murmur - dt * 0.5);
  for (const p of popups) p.t += dt;
  for (let i = popups.length - 1; i >= 0; i--) if (popups[i].t > popups[i].life) popups.splice(i, 1);
  for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 50 * dt; p.rot += dt * 6; }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].t > parts[i].life) parts.splice(i, 1);
  const v = view();
  for (const c of confetti) { c.ph += dt * 3; c.x += (c.vx + Math.sin(c.ph) * 6) * dt; c.y += c.vy * dt; c.rot += c.vr * dt; }
  for (let i = confetti.length - 1; i >= 0; i--) {
    if (confetti[i].y > v.y1 + 4) {
      if (Game.tourney === 'champion' && Game.mode === 'over') { const c = confetti[i]; c.y = v.y0 - 4; c.x = v.x0 + Math.random() * (v.x1 - v.x0); } else confetti.splice(i, 1);
    }
  }
  // 机に戻った道具のぽん
  const ph = Game.mode === 'title' ? '' : Game.phase;
  if (VS.lastPhase === 'result' && ph !== 'result' && ph !== 'over') { VS.retT.hammer = nowT; VS.retT.helmet = nowT; }
  VS.lastPhase = ph;
}

// ---------- 基本の図形（論理座標）----------
function rr(x, y, w, h, r) {
  const X = sx(x), Y = sy(y), W = w * S, H = h * S, R = Math.min(r, w / 2, h / 2) * S;
  g.beginPath(); g.moveTo(X + R, Y); g.arcTo(X + W, Y, X + W, Y + H, R); g.arcTo(X + W, Y + H, X, Y + H, R);
  g.arcTo(X, Y + H, X, Y, R); g.arcTo(X, Y, X + W, Y, R); g.closePath();
}
function fillRR(x, y, w, h, r, fill, stroke, lw) {
  rr(x, y, w, h, r);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = (lw || 0.6) * S; g.stroke(); }
}
function circle(x, y, r, fill, stroke, lw) {
  g.beginPath(); g.arc(sx(x), sy(y), Math.max(0, r) * S, 0, 6.2832);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = (lw || 0.6) * S; g.stroke(); }
}
function rect(x, y, w, h, fill) { g.fillStyle = fill; g.fillRect(sx(x), sy(y), w * S, h * S); }
function txt(str, x, y, size, fill, o) {
  o = o || {};
  g.font = (o.weight || 'bold') + ' ' + (size * S) + 'px ' + FONT;
  g.textAlign = o.align || 'center'; g.textBaseline = o.base || 'middle';
  if (o.stroke) { g.lineJoin = 'round'; g.lineWidth = (o.sw || size * 0.18) * S; g.strokeStyle = o.stroke; g.strokeText(str, sx(x), sy(y)); }
  g.fillStyle = fill; g.fillText(str, sx(x), sy(y));
}
function star(x, y, r, fill, rot, stroke) {
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot + i * Math.PI / 5 - Math.PI / 2, rad = (i % 2 ? r * 0.45 : r) * S;
    const px = sx(x) + Math.cos(a) * rad, py = sy(y) + Math.sin(a) * rad;
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.closePath(); g.fillStyle = fill; g.fill();
  if (stroke) { g.lineJoin = 'round'; g.lineWidth = 0.5 * S; g.strokeStyle = stroke; g.stroke(); }
}

// ---------- 会場 ----------
const AUD_COLS = ['#e8604c', '#4c8fe8', '#3fae6a', '#f0b429', '#a86ad8', '#ec7fb0', '#35b5c4'];
const AUD_HAIR = ['#2a1a14', '#5a3a22', '#1a1a2a', '#8a8a8a', '#c9a24a'];

// のぼり旗（縦書き）。x,y は左上
function nobori(x, y, w, h, color, chars, sway) {
  const sw = Math.sin(sway) * 0.8;
  rect(x - 0.5, y - 1.6, w + 1, 1.2, '#7a4a22');
  g.beginPath();
  g.moveTo(sx(x), sy(y)); g.lineTo(sx(x + w), sy(y)); g.lineTo(sx(x + w + sw), sy(y + h));
  g.lineTo(sx(x + w / 2 + sw), sy(y + h - 2)); g.lineTo(sx(x + sw), sy(y + h)); g.closePath();
  g.fillStyle = color; g.fill(); g.lineWidth = 0.4 * S; g.strokeStyle = '#7a1a1a'; g.stroke();
  const cs = Array.from(chars), n = cs.length, sz = Math.min(w * 0.62, (h - 6) / n);
  for (let i = 0; i < n; i++) txt(cs[i], x + w / 2 + sw * (i / n), y + 3.2 + sz * (i + 0.5), sz, color === '#fff' ? '#c62828' : '#fff', { weight: '900' });
}

function drawAudience(x0, x1, nowT) {
  // 床（体育館）＋観客の列。x0〜x1 の間だけ描く
  if (x1 - x0 < 1) return;
  const exc = VS.crowd, mur = VS.murmur;
  for (let row = 0; row < 3; row++) {
    const sc = 0.85 + row * 0.2, y = 82 + row * 24, step = 15 * sc;
    const i0 = Math.floor(x0 / step) - 1, i1 = Math.ceil(x1 / step) + 1;
    for (let i = i0; i <= i1; i++) {
      const hsh = (i * 7 + row * 13 + 1000) % 17;
      const px = i * step + (row % 2) * step * 0.5;
      if (px < x0 - step || px > x1 + step) continue;
      const bob = Math.sin(nowT * (2.4 + (hsh % 5) * 0.3) + hsh) * (0.5 + exc * 2.2) * sc - exc * Math.abs(Math.sin(nowT * 7 + hsh)) * 2.2 * sc;
      const sway = mur * Math.sin(nowT * 5 + hsh) * 1.2;
      const py = y + bob, c = AUD_COLS[hsh % AUD_COLS.length], hc = AUD_HAIR[hsh % AUD_HAIR.length];
      // 体
      g.beginPath(); g.ellipse(sx(px + sway), sy(py + 11 * sc), 8 * sc * S, 9 * sc * S, 0, Math.PI, 0); g.lineTo(sx(px + 8 * sc + sway), sy(py + 21 * sc)); g.lineTo(sx(px - 8 * sc + sway), sy(py + 21 * sc)); g.closePath();
      g.fillStyle = c; g.fill(); g.lineWidth = 0.4 * S; g.strokeStyle = 'rgba(60,30,10,0.55)'; g.stroke();
      // 手を上げる（盛り上がっているとき）
      if (exc > 0.25 && hsh % 2 === 0) { g.lineCap = 'round'; g.strokeStyle = '#ffd9b0'; g.lineWidth = 2.2 * sc * S; g.beginPath(); g.moveTo(sx(px - 7 * sc + sway), sy(py + 12 * sc)); g.lineTo(sx(px - 10 * sc + sway), sy(py + 2 * sc - Math.sin(nowT * 12 + hsh) * 2 * exc)); g.stroke(); }
      // 頭
      circle(px + sway, py + 2 * sc, 5.6 * sc, '#ffd9b0', 'rgba(60,30,10,0.6)', 0.4);
      g.beginPath(); g.arc(sx(px + sway), sy(py + 2 * sc), 5.7 * sc * S, Math.PI * 1.02, Math.PI * 1.98); g.fillStyle = hc; g.fill();
      circle(px - 1.9 * sc + sway, py + 2.6 * sc, 0.65 * sc, '#2a1a14'); circle(px + 1.9 * sc + sway, py + 2.6 * sc, 0.65 * sc, '#2a1a14');
      if (mur > 0.2 && hsh % 3 === 0) txt('？', px + 5 * sc + sway, py - 5 * sc, 5 * sc, '#c62828', { stroke: '#fff' });
      else { g.beginPath(); g.arc(sx(px + sway), sy(py + 4 * sc), 1.4 * sc * S, 0.15, Math.PI - 0.15); g.strokeStyle = '#a33'; g.lineWidth = 0.5 * S; g.stroke(); }
    }
  }
}

function drawBackground(nowT) {
  const v = view();
  const W0 = v.x0, W1 = v.x1;
  // 壁（公民館の白い壁）
  const grd = g.createLinearGradient(0, sy(v.y0), 0, sy(LAY.floorY));
  grd.addColorStop(0, '#fff6e0'); grd.addColorStop(1, '#ffe7bd');
  g.fillStyle = grd; g.fillRect(sx(W0), sy(v.y0), (W1 - W0) * S, (LAY.floorY - v.y0) * S);
  g.strokeStyle = 'rgba(160,110,60,0.13)'; g.lineWidth = 0.4 * S;

  for (let y = LAY.floorY - 7; y < LAY.floorY; y += 3.5) { g.beginPath(); g.moveTo(sx(W0), sy(y)); g.lineTo(sx(W1), sy(y)); g.stroke(); }
  rect(W0, LAY.floorY - 11, W1 - W0, 1, '#8f5a2c');

// ---------- 机の上の道具とそのアニメ ----------
function popIn(which, nowT) {
  const u = nowT - VS.retT[which];
  if (u < 0 || u > 0.35) return 1;
  const k = u / 0.35;
  return 1 + Math.sin(k * Math.PI) * 0.25 * (1 - k) + (k < 0.35 ? (k / 0.35 - 1) * 0.5 * (1 - k / 0.35) : 0);
}
function lerp(a, b, t) { return a + (b - a) * t; }
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);

function drawTable(nowT) {
  const m = Game.mode === 'match';
  const inGrab = m && Game.phase === 'grab' && !Game.pItem;
  const act = Game.mode !== 'title' && (Game.phase === 'grab' || Game.phase === 'result' || Game.phase === 'over');
  for (const which of ['hammer', 'helmet']) {
    const L = LAY[which];
    const ia = VS.ia[which];
    const moving = act && ia && ia.pon === Game.ponT;
    // 置き場
    fillRR(L.x, L.y, L.w, L.h, 5, inGrab ? 'rgba(255,255,255,0.7)' : 'rgba(130,90,40,0.12)', inGrab ? '#e23b3b' : 'rgba(130,90,40,0.35)', inGrab ? 1 : 0.4);
    if (inGrab) { const pu = 0.5 + 0.5 * Math.sin(nowT * 9); g.globalAlpha = 0.25 * pu; fillRR(L.x - 1, L.y - 1, L.w + 2, L.h + 2, 6, '#ffd23f'); g.globalAlpha = 1; }
    const press = itemPress[which] > 0 ? 1.12 : 1;
    const dim = act && (Game.pItem && Game.pItem !== which) ? 0.45 : 1;
    if (!moving) {
      const k = popIn(which, nowT) * press;
      if (which === 'hammer') { T(L.cx - 1, L.cy + 5, 7.2 * k, 0.8); g.globalAlpha = dim; drawHammerShape(); g.globalAlpha = 1; U(); }
      else { T(L.cx, L.cy + 3, 10.5 * k, 0); g.globalAlpha = dim; drawHelmetShape(); g.globalAlpha = 1; U(); }
    } else {
      const u = nowT - ia.t0;
      if (which === 'hammer') drawMyHammer(ia, u, L);
      else drawMyHelmet(ia, u, L);
    }
  }
}

function drawMyHammer(ia, u, L) {
  const gx0 = L.cx - 8, gy0 = L.cy + 11;     // 机の上の持ち手の位置
  const f = LAY.face;
  if (ia.mode === 'swing') {          // 叩く・ガードされる：相手の頭へ振り下ろす
    const k = clamp(u / 0.11, 0, 1), e = easeOut(k);
    const tx = f.x + 3, ty = f.y - f.r - 2 - 24;   // 持ち手の位置（頭が相手の頭に当たる）
    const rot = lerp(0.8, 3.14, e) + (u > 0.11 ? Math.min(0.15, (u - 0.11) * 3) * (ia.guarded ? -1 : 0) : 0);
    let kk = lerp(7.2, 8.2, e), gx = lerp(gx0, tx, e), gy = lerp(gy0, ty, e);
    if (ia.guarded && u > 0.11) { const b = clamp((u - 0.11) / 0.25, 0, 1); gx += b * 24; gy -= b * 6; }
    const alpha = u > 0.28 ? clamp(1 - (u - 0.28) / 0.17, 0, 1) : 1;
    T(gx, gy, kk, rot); g.globalAlpha = alpha; drawHammerShape(); g.globalAlpha = 1; U();
  } else {                            // 反則：持ち上げてふるふる
    const e = easeOut(u / 0.12);
    const gx = lerp(gx0, L.cx, e), gy = lerp(gy0, L.cy + 4, e);
    const rot = lerp(0.8, 0.2, e) + Math.sin(u * 40) * 0.12 * e;
    const alpha = u > 0.5 ? clamp(1 - (u - 0.5) / 0.3, 0.25, 1) : 1;
    T(gx, gy, lerp(7.2, 9.5, e), rot); g.globalAlpha = alpha; drawHammerShape(); g.globalAlpha = 1; U();
  }
}
function drawMyHelmet(ia, u, L) {
  // 机から自分の頭の上へ（画面の上のほうへ飛んでいって被る）
  const e = easeOut(u / 0.14);
  if (u < 0.2) {
    T(lerp(L.cx, 50, e), lerp(L.cy + 3, 26, e), lerp(10.5, 20, e), 0); drawHelmetShape(); U();
  }
}
function drawViewHelmet(nowT) {
  // 自分が被ったヘルメット：画面の上から下りてくる（見出しの後ろ）
  const u = nowT - VS.viewHelmetT;
  if (u < 0 || u > 1.1) return;

  g.fillStyle = '#ffe680'; g.beginPath(); g.ellipse(sx(34), sy(yb - 8), 14 * S, 3.4 * S, -0.35, 0, 6.2832); g.fill();
  rect(40, yb - 6, 20, 1.4, '#e8b500');
  fillRR(-6, yb + 6, 112, 5, 2.5, '#f0b400', '#8a6a00', 0.8);

function drawButtons(nowT) {

  const waiting = m && (Game.phase === 'wait' || (Game.phase === 'ready' && Game.chosen == null));   // 手を選ぶのを待っている

function drawCallText(nowT) {

// ===== 絵：手・ハンマー・ヘルメット・相手の人物（すべて Canvas で描く）=====
// T(x,y,k,rot) で「その場所を原点、k 倍の大きさ」の座標系にして描く。U() で戻す。
function T(x, y, k, rot, ky) { g.save(); g.translate(sx(x), sy(y)); if (rot) g.rotate(rot); g.scale(k * S, (ky == null ? k : ky) * S); }
function U() { g.restore(); }
function fs(fill, stroke, lw) {
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke(); }
}
function lEll(x, y, rx, ry, fill, stroke, lw, rot) { g.beginPath(); g.ellipse(x, y, Math.max(0.0001, rx), Math.max(0.0001, ry), rot || 0, 0, 6.2832); fs(fill, stroke, lw); }
function lPoly(pts, fill, stroke, lw) { g.beginPath(); for (let i = 0; i < pts.length; i++) i ? g.lineTo(pts[i][0], pts[i][1]) : g.moveTo(pts[i][0], pts[i][1]); g.closePath(); fs(fill, stroke, lw); }
function lLine(x1, y1, x2, y2, w, color) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.strokeStyle = color; g.lineWidth = w; g.lineCap = 'round'; g.stroke(); }
function lRR(x, y, w, h, r, fill, stroke, lw) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); fs(fill, stroke, lw);
}
function lArc(x, y, r, a0, a1, color, lw) { g.beginPath(); g.arc(x, y, r, a0, a1); g.strokeStyle = color; g.lineWidth = lw; g.lineCap = 'round'; g.stroke(); }
function lTxt(str, x, y, size, fill, stroke) {   // T 座標系の中の文字（小さい単位でも崩れないように 100 倍で描く）
  g.save(); g.translate(x, y); g.scale(0.01, 0.01);
  g.font = 'bold ' + (size * 100) + 'px ' + FONT; g.textAlign = 'center'; g.textBaseline = 'middle';
  if (stroke) { g.lineJoin = 'round'; g.lineWidth = size * 18; g.strokeStyle = stroke; g.strokeText(str, 0, 0); }
  g.fillStyle = fill; g.fillText(str, 0, 0); g.restore();
}
function lStar(x, y, r, fill, rot, stroke, lw) {
  g.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r * 0.45 : r; const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad; i ? g.lineTo(px, py) : g.moveTo(px, py); }
  g.closePath(); fs(fill, stroke, lw);
}

// ---------- 手（グー・チョキ・パー：形と色で見分ける）----------

function drawHandShape(h) {

function hairCap(color, a0, a1, bang, ol) {
  // 頭の上の半円の髪。bang = 生え際の高さ（小さいほど深い）
  const r = 1.045;
  g.beginPath();
  g.arc(0, 0, r, Math.PI * a0, Math.PI * a1);
  const ex = Math.cos(Math.PI * a1) * r, ey = Math.sin(Math.PI * a1) * r, sx0 = Math.cos(Math.PI * a0) * r, sy0 = Math.sin(Math.PI * a0) * r;
  g.quadraticCurveTo(0, 2 * bang - ey, sx0, sy0);
  g.closePath(); fs(color, ol || OL, LW);
}
function spikes(color, n, a0, a1, len, base) {
  // 頭のふちから外へ向かうとげとげ
  for (let i = 0; i < n; i++) {
    const t = n === 1 ? 0.5 : i / (n - 1), a = Math.PI * (a0 + (a1 - a0) * t);
    const w = (a1 - a0) * Math.PI / n * 0.62;
    const r0 = 0.96, r1 = 1.04 + len * (1 - Math.abs(t - 0.5) * 0.7);
    lPoly([[Math.cos(a - w) * r0, Math.sin(a - w) * r0], [Math.cos(a + 0.04) * r1, Math.sin(a + 0.04) * r1], [Math.cos(a + w) * r0, Math.sin(a + w) * r0]], color, OL, LW);
  }
}

// 目：mood は normal / nervous / dizzy / confused / smug。t は時間（まばたき・目を回す）
function charEyes(idx, mood, t, o) {
  const ex = 0.4, ey = -0.02;
  const blink = (Math.sin(t * 1.3 + idx * 2) > 0.985) || (idx === 3 && mood === 'normal');
  for (const s of [-1, 1]) {
    const x = ex * s;
    if (mood === 'dizzy') {
      lEll(x, ey, 0.25, 0.26, '#fff', OL, 0.05);
      g.beginPath();
      const spin = (o && o.spin != null ? o.spin : t * 9) * s;
      for (let i = 0; i <= 28; i++) { const a = i * 0.55 + spin, r = 0.02 + i * 0.0072; const px = x + Math.cos(a) * r, py = ey + Math.sin(a) * r; i ? g.lineTo(px, py) : g.moveTo(px, py); }
      g.strokeStyle = '#2a2a2a'; g.lineWidth = 0.045; g.lineCap = 'round'; g.stroke();
    } else if (mood === 'confused') {
      lEll(x, ey, 0.24, 0.26, '#fff', OL, 0.05);            // 目がまっしろ
      lEll(x + 0.02 * s, ey + 0.02, 0.045, 0.045, '#2a2a2a');
    } else if (blink && mood !== 'smug') {
      lArc(x, ey + (idx === 3 ? 0.06 : 0.02), 0.2, Math.PI * 1.12, Math.PI * 1.88, '#3a2a1a', 0.075);
    } else if (mood === 'smug') {
      lEll(x, ey, 0.23, 0.25, '#fff', OL, 0.05);
      lEll(x - 0.03 * s, ey + 0.05, 0.11, 0.12, '#2a2a2a');
      lEll(x - 0.06 * s, ey + 0.0, 0.035, 0.035, '#fff');
      g.beginPath(); g.rect(x - 0.3, ey - 0.3, 0.6, 0.32); g.fillStyle = CHAR_SKIN[idx]; g.fill();                 // まぶたがはんぶん下りる
      lLine(x - 0.26, ey + 0.01, x + 0.26, ey + 0.01, 0.07, '#3a2a1a');
    } else if (mood === 'nervous') {
      lEll(x, ey, 0.23, 0.26, '#fff', OL, 0.05);
      lEll(x + 0.02 * s, ey - 0.06, 0.075, 0.085, '#2a2a2a');
    } else {
      lEll(x, ey, 0.21, 0.26, '#fff', OL, 0.05);
      lEll(x + 0.015 * s, ey + 0.02, 0.115, 0.14, '#2a2a2a');
      lEll(x - 0.02 + 0.015 * s, ey - 0.04, 0.04, 0.04, '#fff');
    }
  }
}
function charMouth(idx, mood, t) {

    lEll(0, my + 0.06, 0.07, 0.07, '#a33', OL, 0.035);

    g.beginPath(); g.moveTo(-0.26, my + 0.04);
    for (let i = 1; i <= 6; i++) g.lineTo(-0.26 + i * 0.087, my + 0.04 + (i % 2 ? -0.045 : 0.045));
    g.strokeStyle = '#8a3a2a'; g.lineWidth = 0.055; g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke();

  }
}
function charBrows(idx, mood) {

    else if (mood === 'smug') lLine(x - 0.2 * s, ay - (s < 0 ? 0.1 : 0.0), x + 0.2 * s, ay + (s < 0 ? 0.0 : 0.08), th, col);
    else if (mood === 'confused') lLine(x - 0.18 * s, ay - 0.08, x + 0.18 * s, ay - 0.08, th * 0.8, col);
    else if (mood === 'dizzy') lLine(x - 0.18 * s, ay + 0.04, x + 0.18 * s, ay - 0.06, th, col);
    else if (idx === 2 || idx === 4) lLine(x - 0.22 * s, ay + 0.1, x + 0.2 * s, ay - 0.05, th, col);
    else lLine(x - 0.18 * s, ay, x + 0.18 * s, ay - 0.02, th, col);

// 人物 1 人を描く。mood と、まわる目の角度などを o で渡す
function drawChar(idx, mood, t, o) {
  o = o || {};

  charHeadBack(idx);
  charHeadShape(idx);
  charExtras(idx, mood);
  charEyes(idx, mood, t, o);

    lTxt('？', 1.5, -1.25 + Math.sin(t * 4.5 + 1) * 0.06, 0.62, '#e23b3b', '#fff');
  }
}
// ===== 演出：相手のやられ方（回戦ごとに大げさに）・叩かれる動き・星 =====
let CP = null;   // いまの相手のポーズ（1 フレームに 1 回計算）

function flyPos(v) {   // 最終戦：左上へ飛んでいく
  return { dx: -(40 * v + 120 * v * v), dy: -(70 * v + 120 * v * v) };
}

function hitPose(P, u, lvl, final) {
  if (u > 1.5) { P.mood = 'normal'; if (lvl >= 4 && final) P.hide = true; return; }
  P.mood = 'dizzy';

      tone(150, 0.6, { type: 'sawtooth', vol: 0.3, hold: 0.45, lp: 1500 }); tone(157, 0.6, { type: 'sawtooth', vol: 0.26, hold: 0.45, lp: 1500 });
      tone(75, 0.6, { type: 'square', vol: 0.16, hold: 0.45 });
    },
    whiff() { tone(300, 0.2, { type: 'sine', vol: 0.3, slide: 0.6 }); },
    // 会場のどよめき「ざわ…ざわ…」
    murmur() {
      for (let i = 0; i < 4; i++) {
        noise(0.34, { f: 380 + (i % 2) * 90, q: 0.9, vol: 0.2, swell: 0.4, delay: i * 0.24 });
        noise(0.3, { f: 900 + i * 60, q: 1.2, vol: 0.1, swell: 0.5, delay: i * 0.24 + 0.05 });
      }
      tone(190, 0.7, { type: 'sawtooth', vol: 0.05, lp: 500, vib: 5, attack: 0.15 });
      tone(240, 0.7, { type: 'sawtooth', vol: 0.04, lp: 500, vib: 4, attack: 0.2, delay: 0.1 });
    },
    // 拍手と歓声
    cheer(big) {
      noise(big ? 1.1 : 0.55, { f: 1700, q: 0.7, vol: big ? 0.3 : 0.18, swell: 0.3 });
      const n = big ? 26 : 10;
      for (let i = 0; i < n; i++) noise(0.025, { f: 2500 + Math.random() * 2500, q: 2, vol: 0.12, delay: Math.random() * (big ? 1.0 : 0.5) });
    },
    // 回戦に勝ったときの短いファンファーレ
    win() {
      [[NOTE.c5, 0], [NOTE.e5, 0.09], [NOTE.g5, 0.18], [NOTE.c6, 0.27]].forEach(([f, d]) => { tone(f, 0.22, { type: 'sawtooth', vol: 0.16, delay: d, lp: 2800 }); tone(f, 0.22, { type: 'triangle', vol: 0.22, delay: d }); });
    },
    // 優勝のファンファーレ「パパパパーン」
    fanfare() {

      for (const [f, d, du] of seq) {
        tone(f, du, { type: 'sawtooth', vol: 0.2, delay: d, lp: 2600, attack: 0.012 });
        tone(f * 2, du, { type: 'square', vol: 0.06, delay: d, lp: 3000 });
        tone(f / 2, du, { type: 'triangle', vol: 0.2, delay: d });
      }
      [NOTE.c5, NOTE.e5, NOTE.g5, NOTE.c6].forEach(f => tone(f, 1.0, { type: 'sawtooth', vol: 0.08, delay: 1.12, lp: 2400 }));
      this.cheer(true);
    },
    // 敗退：ワーワーと下がるトロンボーン
    lose() {
      [[392, 0], [349, 0.32], [330, 0.64]].forEach(([f, d]) => tone(f, 0.3, { type: 'sawtooth', vol: 0.2, delay: d, lp: 1200, slide: 0.92, vib: 7 }));
      tone(262, 0.9, { type: 'sawtooth', vol: 0.22, delay: 0.96, lp: 1100, slide: 0.7, vib: 6, attack: 0.04 });
    },
    // 星になって飛んでいく「ひゅーん」
    zoom() { tone(400, 0.9, { type: 'sine', vol: 0.25, slide: 6, attack: 0.04 }); tone(800, 0.9, { type: 'triangle', vol: 0.1, slide: 5, attack: 0.04 }); },
    // めり込む「ずぼっ」
    sink() { tone(260, 0.3, { type: 'sine', vol: 0.4, slide: 0.3 }); noise(0.25, { f: 400, vol: 0.3, sweep: 120 }); },
    twinkle() { [1568, 2093, 2637].forEach((f, i) => tone(f, 0.25, { type: 'sine', vol: 0.12, delay: i * 0.08 })); }
  };

// ===== 操作・ループ・演出の出し分け・結果 =====
const BEST_KEY = 'tataite-kabutte-best-v2';   // { r: 到達（優勝 = 6）, f: 最速の反応 }
function loadBest() { try { const v = JSON.parse(localStorage.getItem(BEST_KEY)); return v && typeof v === 'object' ? v : {}; } catch (_) { return {}; } }
function saveBest(v) { try { localStorage.setItem(BEST_KEY, JSON.stringify(v)); } catch (_) {} }

let shownResult = false, lastNow = 0, overAt = 0, FROZEN = null;
const timers = [];
const later = (nt, delay, fn) => timers.push({ at: nt + delay, fn });
const nowSec = () => FROZEN != null ? FROZEN : performance.now() / 1000;
// pointerdown の時刻（performance.now と同じ時計）。おかしい値のときは今の時刻
function evTime(e) {
  const n = performance.now(), t = e.timeStamp;
  return (t > 0 && Math.abs(n - t) < 2000 ? t : n) / 1000;
}

function pickHand(h, t) {
  pressT[h] = 0.15;
  if (Game.selectHand(h, t)) Snd.select(h);
}
function pickItem(which, t) {
  if (Game.tapItem(which, t)) { itemPress[which] = 0.15; Snd.tapItem(); }
  else itemPress[which] = 0.08;   // 無効なときも小さく動く（反応なしにしない）
}

function startOrRetry(t) {
  Game.reset();
  shownResult = false;
  popups.length = 0; parts.length = 0; confetti.length = 0; timers.length = 0; react = null; shakeT = 0; flashT = 0;
  VS.cpu = null; VS.ia = { hammer: null, helmet: null }; VS.slam = null; VS.starSky = false; VS.viewHelmetT = -9; VS.introT = -9;
  VS.crowd = 0; VS.murmur = 0; VS.retT = { hammer: -9, helmet: -9 };
  $('result').classList.remove('show', 'wait');
  Game.begin(t);
}

function bindUI() {
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    Snd.init();
    const t = evTime(e);
    if (Game.mode === 'title') { startOrRetry(t); return; }
    if (Game.mode !== 'match') return;
    const p = toLogic(e.clientX, e.clientY);
    // 手のボタン
    if (p.y >= LAY.btnY - 2) {
      for (let h = 0; h < 3; h++) {
        const b = LAY.btns[h];
        if (p.x >= b.x - 1 && p.x <= b.x + b.w + 1) { pickHand(h, t); return; }
      }
      return;
    }
    // 道具（広めに取る）
    if (p.y >= LAY.hammer.y - 4 && p.y < LAY.btnY - 2) {
      pickItem(p.x < 50 ? 'hammer' : 'helmet', t);
    }
  });
  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    const k = e.key, t = evTime(e);
    if (Game.mode === 'title') {
      if (k === '1' || k === '2' || k === '3' || k === ' ' || k === 'Enter' || k === 'ArrowLeft' || k === 'ArrowRight') { e.preventDefault(); Snd.init(); startOrRetry(t); }
      return;
    }
    if (Game.mode === 'over') {
      if ((k === ' ' || k === 'Enter') && !$('result').classList.contains('wait')) { e.preventDefault(); Snd.init(); startOrRetry(t); }
      return;
    }
    if (k === '1' || k === '2' || k === '3') { e.preventDefault(); pickHand(+k - 1, t); }
    else if (k === 'ArrowLeft') { e.preventDefault(); pickItem('hammer', t); }
    else if (k === 'ArrowRight') { e.preventDefault(); pickItem('helmet', t); }
  });
  window.addEventListener('resize', resize);
  window.addEventListener('contextmenu', e => e.preventDefault());
  $('retry').addEventListener('click', () => { Snd.init(); startOrRetry(nowSec()); });
  $('share').addEventListener('click', () => doShare());
}

// 文を文節ごとの span にして入れる（| が文節の切れ目）
function setPhrases(el, text) {
  el.textContent = '';
  text.split('|').forEach(s => { const sp = document.createElement('span'); sp.className = 'ph'; sp.textContent = s; el.appendChild(sp); });
}

function showResult() {
  shownResult = true;
  const champ = Game.tourney === 'champion';
  const reach = champ ? CFG.opps.length + 1 : Game.oppIdx + 1;     // 優勝は 6
  const fastTxt = Game.fastest != null ? Game.fastest.toFixed(2) + ' 秒' : '—';
  $('cert').classList.toggle('hide', !champ);
  $('bracket').classList.toggle('hide', champ);
  if (champ) {
    $('cFast').textContent = fastTxt;
    $('cPraise').textContent = Game.fastest != null ? praiseOf(Game.fastest) : '';
  } else {
    const idx = Game.oppIdx, opp = CFG.opps[idx];
    $('bHead').textContent = roundLabel(idx) + 'で 敗退…';
    const rows = $('bRows'); rows.textContent = '';
    CFG.opps.forEach((o, i) => {
      const li = document.createElement('li');
      li.className = i < idx ? 'ok' : (i === idx ? 'lost' : '');
      const mk = (cls, t) => { const s = document.createElement('span'); s.className = cls; s.textContent = t; li.appendChild(s); };
      mk('dot', i < idx ? '✓' : (i === idx ? '✕' : ''));
      mk('rl', roundLabel(i)); mk('rn', o.name); mk('rs', i < idx ? '勝ち' : (i === idx ? '敗退' : ''));
      rows.appendChild(li);
    });
    $('tWho').textContent = opp.name;
    setPhrases($('tText'), opp.taunt || '');
    const ic = $('oppIcon'), ig = ic.getContext('2d');
    ig.clearRect(0, 0, ic.width, ic.height);
    withCtx(ic, 1, 0, 0, () => { T(80, 92, 58, 0); drawChar(Math.min(idx, 4), 'smug', 0); U(); });
  }
  $('rFast').textContent = fastTxt;
  $('rHits').textContent = Game.stats.hits;
  $('rFouls').textContent = Game.stats.fouls;
  const best = loadBest();
  const nb = { r: Math.max(best.r || 0, reach), f: Game.fastest != null && (!best.f || Game.fastest < best.f) ? Game.fastest : best.f };
  const newReach = reach > (best.r || 0) && (best.r || 0) > 0, newFast = Game.fastest != null && best.f && Game.fastest < best.f - 1e-9;
  saveBest(nb);
  const lab = r => r > CFG.opps.length ? '優勝' : roundLabel(r - 1);
  const bt = (newReach || newFast ? 'ベスト こうしん！|' : '') + '自己ベスト ' + lab(nb.r) + (nb.f ? '|最速 ' + nb.f.toFixed(2) + ' 秒' : '');
  setPhrases($('rBest'), bt);
  prepareShareImage();
  const el = $('result');
  el.classList.add('show', 'wait');   // 指が離れる前にボタンを押してしまわないように、少しの間は触れない
  el.scrollTop = 0;
  setTimeout(() => el.classList.remove('wait'), 700);
}

// ロジックの出来事 → 音と動き
function reactToEvents(nt) {
  for (const e of Game.events) {
    if (e.type === 'start') {
      $('title').classList.add('hide');
      react = null; VS.cpu = null; VS.introT = nt;
    } else if (e.type === 'nextOpp') {
      Snd.win();
      addPopup(roundLabel(e.idx), 50, 123, 13, '#ffd23f', 1.6);
      react = null; VS.cpu = null; VS.slam = null; VS.introT = nt; VS.ia = { hammer: null, helmet: null };
    } else if (e.type === 'call') {
      Snd.call(e.idx, e.aiko);
      react = null;
    } else if (e.type === 'pon') {
      Snd.pon(e.aiko);
    } else if (e.type === 'draw') {
      Snd.draw();
      addPopup('あいこ', 50, 123, 11, '#fff', 0.7);
    } else if (e.type === 'cpuTake') {
      Snd.tapItem();
    } else if (e.type === 'tap') {
      react = { sec: e.react, praise: e.praise, correct: e.correct };
    } else if (e.type === 'outcome') {
      onOutcome(e, nt);
    } else if (e.type === 'over') {
      overAt = nt;
      if (e.tourney === 'champion') { later(nt, 0.1, () => { Snd.fanfare(); startConfetti(110); }); }
    }
  }
  Game.events.length = 0;
}

const HIT_WORDS = ['ピコッ！', 'ピコッ！', 'ずぼっ！', 'ずーん！', 'ぴゅーん！'];
function onOutcome(e, nt) {
  const f = LAY.face, lvl = Math.min(e.oppIdx, CFG.opps.length - 1);
  const final = e.matchResult === 'win' && lvl === CFG.opps.length - 1;
  // 自分の道具の動き
  if (Game.pItem === 'helmet') {
    VS.ia.helmet = { t0: nt, mode: 'don', pon: Game.ponT };
    if (e.outcome === 'guard' || e.outcome === 'wrongHelmet') VS.viewHelmetT = nt;
  } else if (Game.pItem === 'hammer') {
    VS.ia.hammer = { t0: nt, mode: e.outcome === 'foul' ? 'foul' : 'swing', pon: Game.ponT, guarded: e.outcome === 'guarded' };
  }
  switch (e.outcome) {
    case 'hit':
      VS.cpu = { kind: 'hit', t0: nt + 0.1, lvl, final };
      later(nt, 0.1, () => {
        Snd.pico(true); shake(1.4 + lvl * 0.8, 0.2 + lvl * 0.04); flash('#fff', 0.2);
        burst(f.x, f.y - 6, '#ffd23f', 10 + lvl * 4, 38 + lvl * 7, 0.8, true);
        addPopup(lvl === 4 && !final ? 'ぼよーん！' : HIT_WORDS[lvl], 50, 123, 13 + lvl * 1.2, '#ffd23f', 1.1);
        if (lvl === 2 || lvl === 3) { Snd.sink(); burst(f.x, LAY.floorY, '#d9a463', 10 + lvl * 4, 26 + lvl * 6, 0.7); }
        if (final) Snd.zoom();
        VS.crowd = 1;
        Snd.cheer(false);
      });
      if (final) later(nt, 1.25, () => { VS.starSky = true; VS.starT = nt + 1.25; Snd.twinkle(); });
      break;
    case 'cpuFoul':
      Snd.foul();
      VS.cpu = { kind: 'nervous', t0: nt, lvl };
      addPopup('相手の反則！', 50, 123, 10, '#ffd23f', 1.2);
      burst(f.x, f.y - 6, '#ffd23f', 8, 30, 0.6, true); VS.crowd = 0.8;
      break;
    case 'guarded':
      VS.cpu = { kind: 'smug', t0: nt + 0.12, lvl };
      later(nt, 0.12, () => { Snd.guard(); burst(f.x, f.y - 12, '#9bd0ff', 8, 28, 0.5); addPopup('ガードされた！', 50, 123, 10, '#9bd0ff', 1.1); });
      break;
    case 'wrongHelmet':
      Snd.whiff(); Snd.murmur();
      VS.cpu = { kind: 'confused', t0: nt, lvl };
      VS.murmur = 1;
      addPopup('ざわ…ざわ…', 50, 123, 9, '#e8e0d0', 1.4);
      break;
    case 'guard':
      VS.cpu = { kind: 'nervous', t0: nt + 0.12, lvl };
      if (Game.cItem === 'hammer') VS.slam = { kind: 'guard', t0: nt, lvl };
      later(nt, 0.12, () => {
        Snd.guard(); burst(50, 30, '#9bd0ff', 10, 30, 0.5); flash('#9bd0ff', 0.15); shake(0.8, 0.12);
        addPopup('ナイスガード！', 50, 123, 11, '#9bd0ff', 1.1); VS.crowd = 0.6; Snd.cheer(false);
      });
      break;
    case 'cpuHit':
    case 'foul': {
      const isFoul = e.outcome === 'foul';
      if (isFoul) { Snd.foul(); VS.murmur = 0.6; }
      VS.slam = { kind: 'hit', t0: nt, lvl };
      VS.cpu = { kind: 'smug', t0: nt + 0.11, lvl };
      later(nt, 0.11, () => {
        Snd.pico2(); shake(3.2 + lvl * 1.5, 0.35 + lvl * 0.06); flash(isFoul ? '#ff3b3b' : '#ff6b6b', 0.3);
        burst(50, 96, '#ffd23f', 12 + lvl * 6, 44 + lvl * 9, 0.9, true);
        if (lvl >= 3) burst(50, 80, '#fff', 8 + lvl * 3, 50 + lvl * 8, 0.8, true);
        addPopup(isFoul ? '反則！' : (e.timeout ? 'ぼーっとしてた！' : 'ピコッ！'), 50, 123, isFoul ? 14 : (e.timeout ? 9 : 14), '#ff6b6b', 1.1);
        VS.crowd = 0.7;
      });
      break;
    }
    case 'nothing':
      Snd.whiff(); addPopup('…', 50, 123, 9, '#e8e0d0', 0.9); break;
  }
  if (e.matchResult === 'lose') later(nt, 0.5, () => Snd.lose());
  else if (e.matchResult === 'win' && !final) later(nt, 0.45, () => Snd.cheer(true));
}

function stepFrame(nt, dt) {
  Game.advanceTo(nt);
  reactToEvents(nt);
  for (let i = timers.length - 1; i >= 0; i--) if (timers[i].at <= nt) { const t = timers.splice(i, 1)[0]; t.fn(); }
  if (Game.mode === 'over' && !shownResult && nt - overAt > CFG.overDelay) showResult();
  updateVisual(dt, nt);
}

function frame() {
  const nt = nowSec();
  const dt = FROZEN != null ? 0 : (lastNow ? Math.min(nt - lastNow, 0.1) : 0);
  lastNow = nt;
  stepFrame(nt, dt);
  render(nt);
  requestAnimationFrame(frame);
}

// ---------- 見た目の確認用（URL の # で場面を指定。通常のプレイでは使われない）----------
//  例: index.html#dbg&s=hit&opp=2&u=0.3   s: hit foul guard cpuhit guarded wrong cfoul pon call wait / opp: 0〜4 / u: 出来事からの秒 / p,c: 先に取った本数
function debugBoot() {
  const q = new URLSearchParams(location.hash.slice(1));
  if (!q.has('dbg')) return false;
  document.documentElement.classList.add('dbg');
  const s = q.get('s') || 'title', k = +(q.get('opp') || 0), u = +(q.get('u') || 0.3);
  if (s === 'title') { FROZEN = 1000 + u; if (q.has('scan')) debugScan(); return true; }
  if (s === 'bot') { debugBot(q); return true; }
  if (s === 'audio') { try { Snd.init(); for (const k of Object.keys(Snd)) if (k !== 'init') Snd[k](1, true); document.title = 'audio:ok'; } catch (er) { document.title = 'audio:ERR ' + er.message; } return true; }
  if (s === 'gallery') { GALLERY = true; FROZEN = 1000 + u; return true; }
  const SC = {
    hit: { ph: 0, ch: 1, item: 'hammer', after: 0.3, cr: 1.2 }, foul: { ph: 0, ch: 2, item: 'hammer', after: 0.3, cr: 1.2 },
    guard: { ph: 0, ch: 2, item: 'helmet', after: 0.3, cr: 0.9 }, cpuhit: { ph: 0, ch: 2, item: null, cr: 0.5 },
    guarded: { ph: 0, ch: 1, item: 'hammer', after: 0.7, cr: 0.25 }, wrong: { ph: 0, ch: 1, item: 'helmet', after: 0.3, cr: 1.2 },
    cfoul: { ph: 0, ch: 1, item: null, cr: 0.4, mistake: 1 }, pon: { ph: 0, ch: 1, item: null, cr: 1.4 }, call: { ph: 0, ch: 1, item: null, cr: 1.4 }, wait: { ph: 0, ch: 1, item: null, cr: 1.4 }
  };
  const cfg = SC[s] || SC.hit;
  let t = 1000;
  Game.reset(7);
  CFG.opps[k] = Object.assign({}, CFG.opps[k], { mean: cfg.cr, spread: 0.0001, min: 0.01, mistake: cfg.mistake || 0 });
  Game.begin(t);
  Game.oppIdx = k; Game.beginOpp(t, CFG.readyT, 'start');
  Game.score = { p: +(q.get('p') || 0), c: +(q.get('c') || 0) };
  Game.pickCpuHand = () => cfg.ch;
  let sel = false, tapped = false, evT = null;
  for (let i = 0; i < 4000; i++) {
    t += 1 / 60;
    if (Game.phase === 'wait') {
      if (s === 'wait' && evT == null) evT = t;
      if (!sel && s !== 'wait') { Game.selectHand(cfg.ph, t); sel = true; if (s === 'call') evT = t; }
    }
    if (Game.phase === 'grab') {
      if (s === 'pon' && evT == null) evT = Game.ponT;
      if (cfg.item && !tapped && !Game.pItem && t - Game.ponT >= cfg.after) { Game.tapItem(cfg.item, t); tapped = true; evT = t; }
    }
    if (evT == null && Game.outcome) evT = Game.resolveT;
    stepFrame(t, 1 / 60);
    if (evT != null && t >= evT + u) break;
  }
  FROZEN = t;
  if (q.has('scan')) debugScan();
  if (q.has('share')) debugShare();
  return true;
}

// 自動で最後まで遊ぶ（動作確認用。#dbg&s=bot&seed=3&rt=0.4）
function debugBot(q) {
  const seed = +(q.get('seed') || 1), rt = +(q.get('rt') || 0.4);
  Game.reset(seed); let t = 1000; Game.begin(t);
  let tapAt = null, endAt = null;
  for (let i = 0; i < 60 * 600; i++) {
    t += 1 / 60;
    if (Game.mode === 'match') {
      if (Game.phase === 'wait') Game.selectHand(Math.floor(Game.rand() * 3), t);
      if (Game.phase === 'grab' && !Game.pItem && Game.rps && t - Game.ponT >= rt) Game.tapItem(Game.rps === 'win' ? 'hammer' : 'helmet', t);
    }
    stepFrame(t, 1 / 60);
    if (i % 4 === 0) render(t);
    if (Game.mode === 'over' && endAt == null) endAt = t;
    if (endAt != null && t > endAt + 3) break;
  }
  FROZEN = t;
  document.title = 'bot:' + Game.tourney + ':' + (Game.oppIdx + 1) + ':' + JSON.stringify(Game.stats);
}

// 画面の文章が文節の途中で折り返していないか調べる（動作確認用。#dbg&...&scan）
function debugScan() {
  const bad = [];
  document.querySelectorAll('#stage *').forEach(el => {
    if (!el.offsetParent && getComputedStyle(el).position !== 'fixed') return;
    for (const n of el.childNodes) {
      if (n.nodeType !== 3 || !n.textContent.trim()) continue;
      const r = document.createRange(); r.selectNodeContents(n);
      const lines = new Set(Array.from(r.getClientRects()).map(b => Math.round(b.top / 3))).size;
      const unit = el.closest('.ph,.nb') || getComputedStyle(el).whiteSpace === 'nowrap';
      if (lines > 1 && unit) bad.push('折り返し:' + n.textContent.trim().slice(0, 14));
      if (!unit && lines > 1) bad.push('途中で折れる可能性:' + n.textContent.trim().slice(0, 14));
    }
  });
  document.title = 'scan:' + (bad.length ? bad.join(' / ') : 'OK');
}

// 共有の経路の確認（#dbg&...&share）。PC の X 投稿 URL・スマホの Web Share に渡る中身・結果カードの大きさを調べる
function debugShare() {
  const out = [];
  const c = makeCard(); out.push('card ' + c.width + 'x' + c.height);
  if (location.hash.indexOf('showcard') >= 0) { c.style.cssText = 'position:fixed;left:0;top:0;width:600px;z-index:99'; document.body.appendChild(c); }
  let opened = null; const wo = window.open; window.open = u => { opened = u; };
  doShare(); window.open = wo;
  out.push('PC:' + opened);
  let got = null;
  Object.defineProperty(navigator, 'userAgent', { get: () => 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)' });
  navigator.share = d => { got = d; return Promise.resolve(); };
  navigator.canShare = d => !!(d && d.files);
  c.toBlob(b => {
    shareFile = new File([b], 'x.png', { type: 'image/png' });
    doShare();
    out.push('mobile:' + (got ? got.text + ' | ' + got.url + ' | file=' + (got.files && got.files[0].type + ' ' + got.files[0].size + 'B') : 'none'));
    document.title = 'share:' + out.join(' ;; ');
  }, 'image/png');
}
Game.reset();
resize();
bindUI();
debugBoot();
requestAnimationFrame(frame);
</script>
