<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>叩いて被ってジャンケンポン 検証</title>
<style>body{font:16px sans-serif;padding:16px}.ok{color:#080}.ng{color:#c00;font-weight:bold}.info{color:#555}pre{background:#f4f4f4;padding:8px}</style>
</head><body><h1>叩いて被ってジャンケンポン 検証</h1><div id="out"></div>
<script>
// ===== 調整用の数値（遊びながらここを触る）=====
// 論理座標：幅 100 × 高さ 177.8（9:16）。時間の単位はすべて秒。
const CFG = {
  W: 100, H: 177.8,
  // --- 合図のテンポ（手を選ぶまでは待つ。選んだ瞬間から「ジャン」が始まる）---
  readyT: 0.7,        // 試合の最初の間（実況が出る）
  nextOppT: 1.0,      // 次の相手に変わるときの、さらに追加の間
  gapT: 0.4,          // 1 回のあと、手を選べるようになるまで（この間に前もって選んでもよい）
  janT: 0.4,          // 「ジャン」の長さ（手は選び直せる）
  kenT: 0.4,          // 「ケン」の長さ（手は選び直せる）
  aikoCall: 0.5,      // あいこのとき「あいこで」の長さ（これが終わると「しょ」で手が出る）
  drawHold: 0.7,      // あいこの手を見せておく間
  grabTimeout: 1.5,   // 「ポン」から何も取らないままこの時間が過ぎると決着
  resultHold: 1.2,    // 決着を見せておく間
  // --- 試合 ---
  winPoints: 2,       // 先取の本数（長すぎれば 1 にする）
  // --- 反応の秒数のほめ言葉（以下ならその言葉。小さい順）---
  praise: [[0.35, '神速'], [0.45, '速い'], [0.60, 'いいね']],
  // --- 相手（回戦の順。最後が決勝）---
  //  mean: 反応の平均 / spread: ばらつき（標準偏差）/ mistake: 取り違える確率 / min: これより速くは反応しない
  //  habit: ジャンケンのクセ { type, s: クセの強さ（その手を出す確率。外れたら 3 つから気まぐれ） }
  //    type: goo グーが多い / loser 前回負けた手に勝つ手 / repeat 同じ手を続ける / none ばらばら / counter こちらの前回の手に勝つ手
  //    s = 0.5 だと実際にクセの手が出る割合は約 67%
  opps: [
    { name: '近所の小学生',     mean: 0.90, spread: 0.18, mistake: 0.12, min: 0.30, habit: { type: 'goo',     s: 0.5 }, taunt: 'へへーん！|ぼくの|勝ちー！' },
    { name: '学級委員長',       mean: 0.70, spread: 0.14, mistake: 0.06, min: 0.30, habit: { type: 'loser',   s: 0.5 }, taunt: '練習不足ですよ。|出直して|きなさい。' },
    { name: '体育の先生',       mean: 0.58, spread: 0.12, mistake: 0.02, min: 0.28, habit: { type: 'repeat',  s: 0.5 }, taunt: '反応が遅い！|腕立て|三十回だ！' },
    { name: '商店街のおばあちゃん', mean: 0.50, spread: 0.10, mistake: 0,    min: 0.25, habit: { type: 'none',    s: 0 }, taunt: 'あらあら、|飴ちゃん食べて|元気だしなさい。' },
    { name: '町内チャンピオン', mean: 0.47, spread: 0.10, mistake: 0,    min: 0.25, habit: { type: 'counter', s: 0.5 }, taunt: 'その程度では|町内の頂点には|届かんな。' }
  ],
  overDelay: 0.5      // 勝ち抜き戦が終わってから結果を出すまで（UI 側。ロジックの resultHold のあと）
};
// ===== ゲームのロジック（画面を使わない。時刻は秒で明示的に渡す）=====
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 手：0 グー・1 チョキ・2 パー（グー＞チョキ＞パー＞グー）
const HAND_NAME = ['グー', 'チョキ', 'パー'];
const HAND_ICON = ['✊', '✌️', '✋'];
// a から見た b との勝ち負け
function rpsOf(a, b) {
  if (a === b) return 'draw';
  return ((b - a + 3) % 3 === 1) ? 'win' : 'lose';
}
// 反応の秒数 → ほめ言葉（なければ ''）
function praiseOf(sec) {
  for (const [lim, word] of CFG.praise) if (sec <= lim) return word;
  return '';
}

// 実況の一言
const COMM = {
  hit: '決まった！', guarded: 'ガード！', wrongHelmet: 'あれ？被っちゃった',
  cpuHit: '叩かれた！', guard: 'ナイスガード！', foul: 'おっと、反則です！', cpuFoul: '相手の反則！', nothing: '…様子見'
};

// 1 回の決着を決める純粋な関数（表の全部の行がここ）。時刻はすべて「ポン」からの秒数。
//   rps: 自分から見た 'win' | 'lose'
//   pItem: 自分が最初に取った道具 'hammer' | 'helmet' | null（取らなかった）、pT: その時刻
//   cItem / cT: 相手が取る道具と時刻（「ポン」の時点で決めておく）
// 返り値 { type, point('p' 自分 | 'c' 相手 | null), at }
//   type: hit 叩いた / guarded ガードされた / wrongHelmet 勝ったのに被った / cpuHit 叩かれた /
//         guard ガード成功 / foul 反則（負けたのにハンマー）/ cpuFoul 相手の反則 / nothing 何もなし
// 同時刻は守る側（ヘルメット）を優先する。
function resolveRound(rps, pItem, pT, cItem, cT, timeout) {
  // 相手が自分だけで決める出来事（相手がハンマーを取ったとき）
  let auto = null;
  if (cItem === 'hammer') {
    auto = rps === 'lose' ? { type: 'cpuHit', point: 'c', at: cT } : { type: 'cpuFoul', point: 'p', at: cT };
  }
  // 自分の出来事
  let pe = null;
  if (pItem === 'hammer') {
    if (rps === 'lose') pe = { type: 'foul', point: 'c', at: pT };
    else if (cItem === 'helmet' && cT <= pT) pe = { type: 'guarded', point: null, at: pT };
    else pe = { type: 'hit', point: 'p', at: pT };
  } else if (pItem === 'helmet') {
    if (rps === 'win') pe = { type: 'wrongHelmet', point: null, at: pT };
    else pe = { type: 'guard', point: null, at: pT };
  }
  if (pe && auto) {
    // 早い方。同時刻は自分（ヘルメットのガード）を先にする
    return auto.at < pe.at ? auto : pe;
  }
  if (pe) return pe;
  if (auto) return auto;
  // どちらも取らないまま時間切れ
  return rps === 'lose' ? { type: 'cpuHit', point: 'c', at: timeout, timeout: true } : { type: 'nothing', point: null, at: timeout, timeout: true };
}

// a に勝つ手
const winHand = h => (h + 2) % 3;
// 回戦の名前（最後は決勝）
function roundLabel(i) { return i === CFG.opps.length - 1 ? '決勝' : (i + 1) + '回戦'; }

// 相手のクセが「いま出したがっている手」（クセを読んだときの答え）。なければ null
//   goo: いつもグー寄り / loser: 前回負けた手に勝つ手 / repeat: 同じ手を続ける
//   counter: こちらの前回の手に勝つ手 / none: ばらばら
// hist は直前までの手の記録 [{ p: 自分の手, c: 相手の手 }]（この相手との試合の中だけ）
function habitHandOf(opp, hist) {
  const hb = opp.habit;
  if (!hb) return null;
  const last = hist[hist.length - 1];
  switch (hb.type) {
    case 'goo': return 0;
    case 'repeat': return last ? last.c : null;
    case 'loser': {
      if (!last) return null;
      const r = rpsOf(last.p, last.c);
      if (r === 'draw') return null;
      return winHand(r === 'win' ? last.c : last.p);
    }
    case 'counter': return last ? winHand(last.p) : null;
    default: return null;
  }
}

const Game = {
  mode: 'title',        // title → match（勝ち抜き戦の全体）→ over
  phase: '',            // ready → wait（手を選ぶのを待つ）→ call → grab → result → ready … / あいこ: draw → wait …
  time: 0, endT: 0, phaseT0: 0,
  seed: 1, rand: null,
  events: [],

  reset(seed) {
    this.seed = seed == null ? (Date.now() & 0xffffff) : seed;
    this.rand = mulberry32(this.seed);
    this.mode = 'title'; this.phase = ''; this.time = 0; this.endT = 0; this.phaseT0 = 0;
    this.oppIdx = 0; this.opp = CFG.opps[0];
    this.score = { p: 0, c: 0 };
    this.matchResult = '';         // いまの相手との試合：'win' | 'lose'
    this.tourney = '';             // 勝ち抜き戦の結果：'champion' | 'out'
    this.comm = '';
    this.hist = [];                // この相手との試合で出した手の記録 { p, c }
    this.fastest = null;           // 通しての最速（正しい道具を取ったときだけ）
    this.stats = { hits: 0, fouls: 0, guards: 0, wrong: 0 };
    this.clearRound();
    this.events = [];
  },

  clearRound() {
    this.aiko = false; this.callIdx = 0; this.callText = '';
    this.chosen = null;
    this.pHand = null; this.cHand = null; this.rps = '';
    this.ponT = 0; this.cpuDone = false;
    this.cItem = null; this.cReact = 0; this.cMistake = false;
    this.pItem = null; this.pReact = null; this.pCorrect = false; this.pPraise = '';
    this.outcome = ''; this.point = null; this.resolveT = 0;
  },

  emit(e) { e.t = this.time; this.events.push(e); },
  enter(phase, t, dur) { this.phase = phase; this.phaseT0 = t; this.endT = t + dur; },

  // タイトルのタップ。すぐ 1 回戦が始まる
  begin(t) {
    if (this.mode !== 'title') return false;
    this.time = Math.max(this.time, t || 0);
    this.mode = 'match';
    this.oppIdx = 0;
    this.fastest = null;
    this.stats = { hits: 0, fouls: 0, guards: 0, wrong: 0 };
    this.tourney = '';
    this.beginOpp(this.time, CFG.readyT, 'start');
    return true;
  },

  // 相手との試合を始める（最初の相手も、次の相手もここ）
  beginOpp(t, dur, evType) {
    this.opp = CFG.opps[this.oppIdx];
    this.score = { p: 0, c: 0 };
    this.matchResult = '';
    this.hist = [];
    this.clearRound();
    this.comm = roundLabel(this.oppIdx) + '、はじめ';
    this.enter('ready', t, dur);
    this.emit({ type: evType, idx: this.oppIdx });
  },

  // 手を選ぶのを待つ（時間制限なし）。選んだ時刻から「ジャン」が始まる
  startWait(t) {
    this.phase = 'wait'; this.phaseT0 = t; this.endT = Infinity;
    this.emit({ type: 'wait', aiko: this.aiko });
  },

  startCall(t) {
    this.callIdx = 0;
    this.callText = this.aiko ? 'あいこで' : 'ジャン';
    this.enter('call', t, this.aiko ? CFG.aikoCall : CFG.janT);
    this.emit({ type: 'call', idx: 0, text: this.callText, aiko: this.aiko });
  },

  // 時刻 t まで進める。strict のときは t ちょうどの出来事は先に処理しない（同時は守る側が勝つため）
  advanceTo(t, strict) {
    if (!isFinite(t)) return;
    if (this.mode === 'match') {
      for (let guard = 0; guard < 1000; guard++) {
        let evT = this.endT, kind = 'phase';
        if (this.phase === 'grab' && !this.cpuDone) {
          const ct = this.ponT + this.cReact;
          if (ct <= evT) { evT = ct; kind = 'cpu'; }
        }
        if (strict ? evT >= t : evT > t) break;
        this.time = Math.max(this.time, evT);
        if (kind === 'cpu') this.cpuEvent(evT); else this.phaseEnd();
        if (this.mode !== 'match') break;
      }
    }
    this.time = Math.max(this.time, t);
  },

  phaseEnd() {
    const t = this.endT;
    switch (this.phase) {
      case 'ready':
        if (this.chosen != null) this.startCall(t);   // 前もって選んでいたらすぐ「ジャン」
        else this.startWait(t);
        break;
      case 'call':
        if (!this.aiko && this.callIdx === 0) {
          this.callIdx = 1; this.callText = 'ケン';
          this.enter('call', t, CFG.kenT);
          this.emit({ type: 'call', idx: 1, text: 'ケン', aiko: false });
        } else this.pon(t);
        break;
      case 'draw':
        this.clearRound(); this.aiko = true;
        this.startWait(t);
        break;
      case 'grab':   // 時間切れ
        if (!this.outcome) this.finish(resolveRound(this.rps, this.pItem, this.pReact, this.cItem, this.cReact, CFG.grabTimeout), t);
        break;
      case 'result':
        if (this.matchResult === 'win' && this.oppIdx < CFG.opps.length - 1) {
          this.oppIdx++;
          this.beginOpp(t, CFG.readyT + CFG.nextOppT, 'nextOpp');
        } else if (this.matchResult) {
          this.tourney = this.matchResult === 'win' ? 'champion' : 'out';
          this.mode = 'over'; this.phase = 'over';
          this.emit({ type: 'over', tourney: this.tourney });
        } else {
          this.clearRound();
          this.comm = '';
          this.enter('ready', t, CFG.gapT);
        }
        break;
    }
  },

  // 相手のジャンケンのクセ。クセの強さ s の確率でクセの手、外れたら気まぐれ（3 つから）
  pickCpuHand() {
    const r = this.rand;
    const a = r(), b = r();
    const h = habitHandOf(this.opp, this.hist);
    if (h != null && a < this.opp.habit.s) return h;
    return Math.floor(b * 3);
  },

  // 「ポン」（あいこのときは「しょ」）
  pon(t) {
    this.ponT = t;
    this.pHand = this.chosen != null ? this.chosen : 0;
    this.cHand = this.pickCpuHand();
    this.rps = rpsOf(this.pHand, this.cHand);
    this.hist.push({ p: this.pHand, c: this.cHand });
    this.callText = this.aiko ? 'しょ' : 'ポン';
    // 相手の反応は「ポン」の時点で決めておく
    const r = this.rand, o = this.opp;
    const z = (r() + r() + r() - 1.5) / 0.5;           // ほぼ正規分布（標準偏差 1）
    this.cReact = Math.round(clamp(o.mean + z * o.spread, o.min, CFG.grabTimeout - 0.1) * 1e6) / 1e6;
    this.cMistake = r() < o.mistake;
    this.cpuDone = false; this.pItem = null;
    this.emit({ type: 'pon', text: this.callText, aiko: this.aiko, pHand: this.pHand, cHand: this.cHand, rps: this.rps });
    if (this.rps === 'draw') {
      this.cItem = null;
      this.comm = 'あいこ';
      this.enter('draw', t, CFG.drawHold);
      this.emit({ type: 'draw' });
      return;
    }
    const cWins = this.rps === 'lose';                  // 相手が勝ったなら正解はハンマー
    this.cItem = (cWins !== this.cMistake) ? 'hammer' : 'helmet';
    this.comm = '';
    this.enter('grab', t, CFG.grabTimeout);
  },

  // 相手が道具を取る
  cpuEvent(t) {
    this.cpuDone = true;
    this.emit({ type: 'cpuTake', item: this.cItem, mistake: this.cMistake });
    if (this.cItem === 'hammer' && !this.outcome) {
      this.finish(resolveRound(this.rps, this.pItem, this.pReact, this.cItem, this.cReact, CFG.grabTimeout), t);
    }
  },

  // 手を選ぶ。待っているとき（wait）はここから「ジャン」が始まる。「ジャン」「ケン」の間は選び直せる。
  // 次の回の前の間（ready）に前もって選んでおくこともできる
  selectHand(h, t) {
    if (t != null) this.advanceTo(t, true);
    if (this.mode !== 'match') return false;
    if (this.phase === 'wait') {
      this.chosen = h;
      this.emit({ type: 'select', hand: h });
      this.startCall(Math.max(t == null ? this.time : t, this.time));
      return true;
    }
    if (this.phase === 'call' || this.phase === 'ready') {
      this.chosen = h;
      this.emit({ type: 'select', hand: h });
      return true;
    }
    return false;
  },

  // 道具をタップ（pointerdown の時刻 t で即判定）
  tapItem(which, t) {
    if (t == null) t = this.time;
    this.advanceTo(t, true);
    if (this.mode !== 'match' || this.phase !== 'grab' || this.pItem || this.outcome) return false;
    if (t < this.ponT) return false;                    // 「ポン」より前の分は無効
    const rel = Math.round((t - this.ponT) * 1e6) / 1e6;   // 浮動小数の誤差で同時刻がずれないように
    this.pItem = which; this.pReact = rel;
    this.pCorrect = (this.rps === 'win' && which === 'hammer') || (this.rps === 'lose' && which === 'helmet');
    this.pPraise = this.pCorrect ? praiseOf(rel) : '';
    if (this.pCorrect && (this.fastest == null || rel < this.fastest)) this.fastest = rel;
    this.emit({ type: 'tap', item: which, react: rel, correct: this.pCorrect, praise: this.pPraise });
    const r = resolveRound(this.rps, which, rel, this.cItem, this.cReact, CFG.grabTimeout);
    this.finish(r, this.ponT + r.at);
    return true;
  },

  finish(r, t) {
    this.time = Math.max(this.time, t);
    this.outcome = r.type; this.point = r.point; this.resolveT = t;
    if (r.point === 'p') this.score.p++;
    if (r.point === 'c') this.score.c++;
    if (r.type === 'hit') this.stats.hits++;
    if (r.type === 'foul') this.stats.fouls++;
    if (r.type === 'guard') this.stats.guards++;
    if (r.type === 'wrongHelmet') this.stats.wrong++;
    this.comm = COMM[r.type] || '';
    if (this.score.p >= CFG.winPoints) this.matchResult = 'win';
    else if (this.score.c >= CFG.winPoints) this.matchResult = 'lose';
    this.enter('result', t, CFG.resultHold);
    this.emit({ type: 'outcome', outcome: r.type, point: r.point, timeout: !!r.timeout, score: { p: this.score.p, c: this.score.c }, matchResult: this.matchResult, oppIdx: this.oppIdx });
  }
};
// ===== 自動テスト（画面なし。時刻を渡して 1 回ずつ・ボットで勝ち抜き戦を回す）=====
(function () {
  const out = document.getElementById('out');
  let fail = 0, total = 0;
  function check(name, cond, note) {
    total++;
    if (!cond) fail++;
    const p = document.createElement('div');
    p.className = cond ? 'ok' : 'ng';
    p.textContent = (cond ? 'PASS  ' : 'FAIL  ') + name + (note ? '  [' + note + ']' : '');
    out.appendChild(p);
  }
  function info(text) {
    const p = document.createElement('div');
    p.className = 'info'; p.textContent = '    ' + text;
    out.appendChild(p);
  }
  function head(text) {
    const p = document.createElement('h3'); p.textContent = text; out.appendChild(p);
  }
  const ORIG_PICK = Game.pickCpuHand;
  const pct = x => (x * 100).toFixed(1) + '%';

  // ---------- 1. 判定表（resolveRound）の全部の行 ----------
  head('1. 判定表');
  const TO = CFG.grabTimeout;
  const R = (rps, pItem, pT, cItem, cT) => resolveRound(rps, pItem, pT, cItem, cT, TO);
  function row(name, r, type, point) {
    check(name, r.type === type && r.point === point, '→ ' + r.type + '/' + r.point + '（期待 ' + type + '/' + point + '）');
  }
  row('勝ち＋ハンマー（相手がヘルメットを被るより速い）→ 自分の 1 本', R('win', 'hammer', 0.5, 'helmet', 0.9), 'hit', 'p');
  row('勝ち＋ハンマー（相手が先に被った）→ ガードされた・本数なし', R('win', 'hammer', 0.9, 'helmet', 0.5), 'guarded', null);
  row('勝ち＋ヘルメット → 間違い・本数なし', R('win', 'helmet', 0.5, 'helmet', 0.9), 'wrongHelmet', null);
  row('勝ち＋ハンマー（相手が負けたのにハンマーを取った・相手が先）→ 相手の反則で自分の 1 本', R('win', 'hammer', 0.9, 'hammer', 0.5), 'cpuFoul', 'p');
  row('勝ち＋ハンマー（相手が負けたのにハンマー・自分が先）→ 自分の 1 本', R('win', 'hammer', 0.4, 'hammer', 0.6), 'hit', 'p');
  row('勝ち＋何も取らない・相手が正しく被る → 時間切れで何もなし', R('win', null, null, 'helmet', 0.9), 'nothing', null);
  row('勝ち＋何も取らない・相手が負けたのにハンマー → 相手の反則で自分の 1 本', R('win', null, null, 'hammer', 0.9), 'cpuFoul', 'p');
  row('負け＋ヘルメット（相手が叩くより速い）→ ガード成功・本数なし', R('lose', 'helmet', 0.5, 'hammer', 0.9), 'guard', null);
  row('負け＋ヘルメット（相手が先に叩いた）→ 相手の 1 本', R('lose', 'helmet', 0.9, 'hammer', 0.5), 'cpuHit', 'c');
  row('負け＋ハンマー → 反則・相手の 1 本', R('lose', 'hammer', 0.3, 'hammer', 0.9), 'foul', 'c');
  row('負け＋ハンマー（相手が先に叩いていた）→ 相手の 1 本', R('lose', 'hammer', 0.9, 'hammer', 0.5), 'cpuHit', 'c');
  row('負け＋ハンマー（相手が取り違えてヘルメット）→ 反則・相手の 1 本', R('lose', 'hammer', 0.3, 'helmet', 0.9), 'foul', 'c');
  row('負け＋ヘルメット（相手が取り違えてヘルメット）→ 本数なし', R('lose', 'helmet', 1.2, 'helmet', 0.5), 'guard', null);
  row('負け＋何も取らない → 相手が叩く・相手の 1 本', R('lose', null, null, 'hammer', 1.2), 'cpuHit', 'c');
  row('負け＋何も取らない・相手が取り違えても時間切れで叩かれる', R('lose', null, null, 'helmet', 0.7), 'cpuHit', 'c');
  const rto = R('lose', null, null, 'helmet', 0.7);
  check('時間切れの決着は ' + TO + ' 秒', rto.at === TO, 'at=' + rto.at);
  row('同時刻（勝ち＋ハンマー vs 相手ヘルメット）→ 守る側が勝つ（ガードされた）', R('win', 'hammer', 0.6, 'helmet', 0.6), 'guarded', null);
  row('同時刻（負け＋ヘルメット vs 相手ハンマー）→ 守る側が勝つ（ガード成功）', R('lose', 'helmet', 0.6, 'hammer', 0.6), 'guard', null);

  // ---------- 2. 流れ（手を選んで始まる合図・タップ）----------
  head('2. 流れ（手を選ぶのを待つ → ジャン・ケン・ポン → 取り合い）');
  function fresh(seed) { Game.reset(seed || 1); Game.begin(0); }
  // 「ポン」まで進めて取り合いの状態にする（あいこなら選び直して進める）。強制的に手と相手の動きを決める
  function toGrab(o) {
    o = o || {};
    fresh(o.seed);
    if (o.cHand != null) Game.pickCpuHand = function () { ORIG_PICK.call(this); return o.cHand; };
    for (let n = 0; n < 30 && Game.phase !== 'grab'; n++) {
      if (Game.phase === 'wait') Game.selectHand(o.pHand != null ? o.pHand : 0, Game.time);
      else Game.advanceTo(Game.endT);
    }
    Game.pickCpuHand = ORIG_PICK;
    if (o.rps) Game.rps = o.rps;
    if (o.cItem) Game.cItem = o.cItem;
    if (o.cReact != null) Game.cReact = o.cReact;
    return Game.phase === 'grab';
  }
  function playRow(rps, which, react, cItem, cReact) {
    // 自分グー(0)、相手 チョキ(1)=勝ち / パー(2)=負け
    const ok = toGrab({ pHand: 0, cHand: rps === 'win' ? 1 : 2, cItem, cReact });
    if (!ok) return null;
    if (which) Game.tapItem(which, Game.ponT + react);
    else Game.advanceTo(Game.ponT + TO + 0.01);
    return { outcome: Game.outcome, point: Game.point, score: { ...Game.score }, phase: Game.phase };
  }
  let r;
  r = playRow('win', 'hammer', 0.5, 'helmet', 0.9);
  check('流れ：勝ち＋ハンマーで自分の 1 本、スコア 1-0', r && r.outcome === 'hit' && r.score.p === 1 && r.score.c === 0 && r.phase === 'result', JSON.stringify(r));
  r = playRow('win', 'hammer', 0.9, 'helmet', 0.5);
  check('流れ：先に被られたらガードされ、スコア 0-0', r && r.outcome === 'guarded' && r.score.p === 0 && r.score.c === 0, JSON.stringify(r));
  r = playRow('win', 'helmet', 0.5, 'helmet', 0.9);
  check('流れ：勝ったのにヘルメットは間違い、スコア 0-0', r && r.outcome === 'wrongHelmet' && r.score.p === 0 && r.score.c === 0, JSON.stringify(r));
  r = playRow('lose', 'helmet', 0.5, 'hammer', 0.9);
  check('流れ：負け＋速いヘルメットでガード成功、スコア 0-0', r && r.outcome === 'guard' && r.score.p === 0 && r.score.c === 0, JSON.stringify(r));
  r = playRow('lose', 'helmet', 1.2, 'hammer', 0.6);
  check('流れ：負け＋遅いヘルメットは叩かれる（タップ前に相手の 1 本が決まる）、スコア 0-1', r && r.outcome === 'cpuHit' && r.score.c === 1 && r.score.p === 0, JSON.stringify(r));
  r = playRow('lose', 'hammer', 0.3, 'hammer', 0.9);
  check('流れ：負け＋ハンマーは反則で相手の 1 本、スコア 0-1', r && r.outcome === 'foul' && r.score.c === 1, JSON.stringify(r));
  r = playRow('lose', null, 0, 'hammer', 0.9);
  check('流れ：負けて何も取らないと叩かれる（相手の反応の時刻に決着）', r && r.outcome === 'cpuHit' && Math.abs(Game.resolveT - Game.ponT - 0.9) < 0.001, JSON.stringify(r));
  r = playRow('lose', null, 0, 'helmet', 0.9);
  check('流れ：負けて何も取らず相手も取り違え → ' + TO + ' 秒で叩かれる', r && r.outcome === 'cpuHit' && Math.abs(Game.resolveT - Game.ponT - TO) < 0.001, JSON.stringify(r));
  r = playRow('win', null, 0, 'helmet', 0.9);
  check('流れ：勝って何も取らなければ何もなし、スコア 0-0', r && r.outcome === 'nothing' && r.score.p === 0 && r.score.c === 0, JSON.stringify(r));
  r = playRow('win', null, 0, 'hammer', 0.7);
  check('流れ：相手が負けたのにハンマーを取ると相手の反則で自分の 1 本', r && r.outcome === 'cpuFoul' && r.score.p === 1, JSON.stringify(r));
  toGrab({ pHand: 0, cHand: 1, cItem: 'helmet', cReact: 0.6 }); Game.tapItem('hammer', Game.ponT + 0.6);
  check('流れ：同時刻（ハンマー vs 相手のヘルメット）はガードされる', Game.outcome === 'guarded', Game.outcome);
  toGrab({ pHand: 0, cHand: 2, cItem: 'hammer', cReact: 0.6 }); Game.tapItem('helmet', Game.ponT + 0.6);
  check('流れ：同時刻（ヘルメット vs 相手のハンマー）はガード成功', Game.outcome === 'guard', Game.outcome);

  toGrab({ pHand: 0, cHand: 1 });
  check('「ポン」の直後は勝ち負けの文字なし（実況が空・結果が未決）', Game.comm === '' && Game.outcome === '' && Game.pHand === 0 && Game.cHand === 1, 'comm="' + Game.comm + '"');
  Game.tapItem('hammer', Game.ponT + 0.4);
  check('道具を取った後に結果の実況が出る', Game.comm === COMM.hit, Game.comm);
  check('反応の秒数が記録される（0.40 秒）と、ほめ言葉は「速い」', Math.abs(Game.pReact - 0.4) < 1e-9 && Game.pPraise === '速い', Game.pReact + ' ' + Game.pPraise);
  check('ほめ言葉のしきい値（0.30 神速 / 0.40 速い / 0.55 いいね / 0.70 なし）', praiseOf(0.30) === '神速' && praiseOf(0.40) === '速い' && praiseOf(0.55) === 'いいね' && praiseOf(0.70) === '', '');

  // --- 手を選ぶまで待つ。選んだ瞬間から「ジャン」が始まる ---
  fresh(3);
  Game.advanceTo(CFG.readyT);
  check('最初の間のあと、手を選ぶのを待つ状態（wait）になる', Game.phase === 'wait' && Game.endT === Infinity && Game.chosen == null, Game.phase);
  Game.events.length = 0;
  Game.advanceTo(CFG.readyT + 120);
  check('手を選ばないかぎり 120 秒たっても待ち続ける（ジャンもポンも始まらない・時間切れなし）', Game.phase === 'wait' && Game.events.length === 0 && Game.pHand == null && Game.score.c === 0, Game.phase);
  check('待っている間は道具のタップを無視', Game.tapItem('hammer', Game.time) === false && Game.tapItem('helmet', Game.time + 1) === false && Game.pItem === null);
  const tSel = Game.time + 0.5;
  check('手をタップすると「ジャン」が始まる', Game.selectHand(1, tSel) === true && Game.phase === 'call' && Game.callText === 'ジャン' && Game.chosen === 1 && Math.abs(Game.phaseT0 - tSel) < 1e-9, Game.phase + ' ' + Game.callText);
  check('ジャンの間も道具は取れない', Game.tapItem('hammer', Game.time + 0.1) === false);
  Game.advanceTo(tSel + CFG.janT + 0.05);
  check('0.4 秒後に「ケン」', Game.phase === 'call' && Game.callText === 'ケン', Game.callText);
  check('ケンの間も道具は取れない', Game.tapItem('helmet', Game.time) === false && Game.pItem === null);
  check('ケンの間は手を選び直せる（選び直しても合図は進み続ける）', Game.selectHand(2, Game.time) === true && Game.chosen === 2 && Game.phase === 'call' && Game.callText === 'ケン');
  const ponAt = tSel + CFG.janT + CFG.kenT;
  Game.advanceTo(ponAt - 0.001);
  check('ポンの直前まではまだ道具を取れない', Game.phase === 'call' && Game.tapItem('hammer', ponAt - 0.001) === false);
  Game.advanceTo(ponAt + 0.001);
  check('ジャン' + CFG.janT + '秒 → ケン' + CFG.kenT + '秒 → ポン。ポンで最後に選んだ手（パー）が出る', Math.abs(Game.ponT - ponAt) < 1e-9 && Game.pHand === 2 && (Game.phase === 'grab' || Game.phase === 'draw'), 'ponT=' + Game.ponT.toFixed(3) + ' pHand=' + Game.pHand);
  check('ポンの後は手を選び直せない', Game.selectHand(0, Game.time) === false);

  // --- 前回の手へのデフォルトはない。手を選ばずに「ポン」にはならない ---
  fresh(4);
  Game.advanceTo(30);
  check('手を選ばずに「ポン」になることはない（デフォルトの手はなし）', Game.phase === 'wait' && Game.hist.length === 0);

  // --- 次の回：結果のあとに手を選べる（前もって選んでもよい）---
  toGrab({ pHand: 0, cHand: 1 });
  Game.tapItem('hammer', Game.ponT + 0.3);                  // 勝ち：1 本
  Game.advanceTo(Game.endT);                                // 結果の表示が終わる → ready
  check('1 回のあとは少しの間（ready）のあと、また手を選ぶのを待つ', Game.phase === 'ready' && Game.chosen == null && Game.pHand == null);
  Game.selectHand(1, Game.time + 0.1);
  check('次の回の前の間に前もって手を選べる（まだジャンは始まらない）', Game.phase === 'ready' && Game.chosen === 1);
  Game.advanceTo(Game.endT);
  check('前もって選んでいたら、間が終わった瞬間に「ジャン」が始まる', Game.phase === 'call' && Game.callText === 'ジャン' && Game.chosen === 1, Game.phase);

  // --- あいこ：選び直しを待つ・道具は取れない・短い合図 ---
  fresh(7);
  Game.pickCpuHand = function () { return 1; };             // 相手はチョキ固定
  Game.advanceTo(CFG.readyT); Game.selectHand(1, Game.time);   // 自分もチョキ → あいこ
  Game.advanceTo(Game.endT); Game.advanceTo(Game.endT);
  check('同じ手ならあいこ（道具の取り合いにならない）', Game.phase === 'draw' && Game.rps === 'draw' && Game.cItem === null, Game.phase);
  check('あいこの間は道具を取れない', Game.tapItem('hammer', Game.time + 0.01) === false && Game.outcome === '');
  Game.advanceTo(Game.endT);
  check('あいこの手を見せたあと、手を選び直すのを待つ（時間制限なし）', Game.phase === 'wait' && Game.aiko === true && Game.endT === Infinity, Game.phase);
  Game.advanceTo(Game.time + 60);
  check('あいこの待ちも 60 秒たっても進まない', Game.phase === 'wait' && Game.chosen == null);
  const tA = Game.time + 0.2;
  check('手を選ぶと「あいこで」が始まる（短い合図）', Game.selectHand(0, tA) === true && Game.phase === 'call' && Game.callText === 'あいこで' && Math.abs(Game.endT - (tA + CFG.aikoCall)) < 1e-9, Game.phase + ' ' + Game.callText);
  check('あいこの合図はジャン＋ケンより短い', CFG.aikoCall < CFG.janT + CFG.kenT, CFG.aikoCall + ' < ' + (CFG.janT + CFG.kenT));
  check('「あいこで」の間も道具は取れない', Game.tapItem('hammer', Game.time) === false);
  Game.advanceTo(Game.endT + 0.0001);
  check('「しょ」で選んだ手（グー）が出る → グー vs チョキ＝勝ち、取り合いへ', Game.callText === 'しょ' && Game.pHand === 0 && Game.rps === 'win' && Game.phase === 'grab', Game.callText + ' pHand=' + Game.pHand + ' ' + Game.phase);
  check('あいこは本数に入らない', Game.score.p === 0 && Game.score.c === 0);
  Game.pickCpuHand = ORIG_PICK;

  // ---------- 3. 勝ち抜き戦の進み方 ----------
  head('3. 勝ち抜き戦');
  // 完璧なボットで進める（0.3 秒で正しい道具）
  function perfectStep(react) {
    if (Game.phase === 'wait') Game.selectHand(0, Game.time);
    else if (Game.phase === 'grab' && !Game.pItem) Game.tapItem(Game.rps === 'win' ? 'hammer' : 'helmet', Game.ponT + react);
    else Game.advanceTo(Game.endT);
  }
  fresh(9);
  let g1 = 0;
  while (Game.oppIdx === 0 && Game.mode === 'match' && g1++ < 500) perfectStep(0.3);
  check('1 回戦に 2 本先取で勝つと、2 回戦（学級委員長）が始まる（終わらない）', Game.mode === 'match' && Game.oppIdx === 1 && Game.opp.name === CFG.opps[1].name && Game.phase === 'ready', 'oppIdx=' + Game.oppIdx + ' phase=' + Game.phase + ' mode=' + Game.mode);
  check('次の相手ではスコアと手の記録がリセットされ、実況は「2回戦、はじめ」', Game.score.p === 0 && Game.score.c === 0 && Game.hist.length === 0 && Game.comm === '2回戦、はじめ', Game.comm);
  check('最速の反応は勝ち抜き戦を通して持ち越される（0.30 秒）', Game.fastest != null && Math.abs(Game.fastest - 0.3) < 1e-9 && Game.stats.hits >= 2, String(Game.fastest) + ' hits=' + Game.stats.hits);
  check('回戦の名前：1〜4 回戦と決勝', roundLabel(0) === '1回戦' && roundLabel(3) === '4回戦' && roundLabel(4) === '決勝' && CFG.opps.length === 5);
  let g2 = 0;
  while (Game.mode === 'match' && g2++ < 3000) perfectStep(0.3);
  check('0.3 秒の完璧なボットは 5 人抜いて優勝（over / champion）', Game.mode === 'over' && Game.tourney === 'champion' && Game.oppIdx === 4 && Game.score.p === CFG.winPoints, 'mode=' + Game.mode + ' tourney=' + Game.tourney + ' oppIdx=' + Game.oppIdx);
  check('優勝のあとは道具のタップを無視', Game.tapItem('hammer', Game.time + 1) === false);
  // 負けたら終わり
  fresh(10);
  let g3 = 0;
  while (Game.mode === 'match' && g3++ < 500) {
    if (Game.phase === 'wait') Game.selectHand(0, Game.time);
    else if (Game.phase === 'grab' && !Game.pItem) Game.tapItem('hammer', Game.ponT + 0.1);   // いつもハンマー（負けると反則）
    else Game.advanceTo(Game.endT);
  }
  check('負けたら終わり（over / out）。何回戦で負けたかが oppIdx に残る', Game.mode === 'over' && Game.tourney === 'out' && Game.matchResult === 'lose' && Game.score.c === CFG.winPoints, 'oppIdx=' + Game.oppIdx + ' tourney=' + Game.tourney);

  // ---------- 4. 相手のクセ ----------
  head('4. 相手のクセ（1000 回出して割合を確かめる）');
  const rngP = mulberry32(777);
  function throws(oppIdx, n, playerFn) {
    Game.reset(100 + oppIdx); Game.begin(0);
    Game.opp = CFG.opps[oppIdx]; Game.hist = [];
    const res = { n, habit: 0, hab: 0, win: 0, lose: 0, draw: 0, cnt: [0, 0, 0] };
    for (let i = 0; i < n; i++) {
      const exp = habitHandOf(Game.opp, Game.hist);
      const c = Game.pickCpuHand();
      res.cnt[c]++;
      if (exp != null) { res.habit++; if (c === exp) res.hab++; }
      const p = playerFn(exp);
      const rr = rpsOf(p, c);
      res[rr]++;
      Game.hist.push({ p, c });
    }
    return res;
  }
  const randHand = () => Math.floor(rngP() * 3);
  for (let i = 0; i < CFG.opps.length; i++) {
    const o = CFG.opps[i], hb = o.habit;
    const res = throws(i, 1000, randHand);
    if (hb.type === 'none') {
      const mx = Math.max(...res.cnt) / 1000, mn = Math.min(...res.cnt) / 1000;
      info(o.name + '（ばらばら）：グー ' + pct(res.cnt[0] / 1000) + ' / チョキ ' + pct(res.cnt[1] / 1000) + ' / パー ' + pct(res.cnt[2] / 1000));
      check(o.name + 'はばらばら（どの手も 28〜39%）', mn > 0.28 && mx < 0.39, pct(mn) + '〜' + pct(mx));
    } else {
      const expect = hb.s + (1 - hb.s) / 3, got = res.hab / res.habit;
      info(o.name + '（' + hb.type + '）：クセの手が出た割合 ' + pct(got) + '（期待 ' + pct(expect) + '、' + res.habit + ' 回中）');
      check(o.name + 'のクセの手は 1000 回で約 ' + pct(expect) + '（±5%）出る', Math.abs(got - expect) < 0.05 && expect >= 0.6 && expect <= 0.72, pct(got));
    }
  }
  // クセを読むボット vs ランダムのボット（ジャンケンだけの勝率。あいこは除く）
  for (let i = 0; i < CFG.opps.length; i++) {
    const o = CFG.opps[i];
    const rd = throws(i, 3000, exp => exp != null ? winHand(exp) : randHand());
    const rn = throws(i, 3000, randHand);
    const wr = rd.win / (rd.win + rd.lose), wn = rn.win / (rn.win + rn.lose);
    info(o.name + '：クセを読む ' + pct(wr) + ' / ランダム ' + pct(wn) + '（あいこを除いた勝率）');
    if (o.habit.type === 'none') check(o.name + 'はクセがない：読んでもランダムと同じ（差 5% 未満）', Math.abs(wr - wn) < 0.05, pct(wr) + ' vs ' + pct(wn));
    else check(o.name + 'のクセを読むと、ランダムよりジャンケンに勝ちやすい（+15% 以上）', wr > wn + 0.15 && Math.abs(wn - 0.5) < 0.04, pct(wr) + ' vs ' + pct(wn));
  }
  // 相手の反応の分布
  for (let i = 0; i < CFG.opps.length; i++) {
    const o = CFG.opps[i];
    Game.reset(200 + i); Game.begin(0); Game.opp = o;
    let sum = 0, mn = 9, mx = 0, mis = 0; const K = 3000;
    for (let k = 0; k < K; k++) { Game.hist = []; Game.pon(0); sum += Game.cReact; mn = Math.min(mn, Game.cReact); mx = Math.max(mx, Game.cReact); if (Game.cMistake) mis++; }
    info(o.name + '：反応 平均 ' + (sum / K).toFixed(2) + ' 秒（' + mn.toFixed(2) + '〜' + mx.toFixed(2) + '）、取り違え ' + pct(mis / K));
    check(o.name + 'の反応の平均は設定の ' + o.mean + ' 秒に近く、ばらつきがあり、タイムアウトより前に動く', Math.abs(sum / K - o.mean) < 0.03 && mx - mn > 0.15 && mx < CFG.grabTimeout, '');
  }
  const meanOrder = CFG.opps.map(o => o.mean);
  check('回戦が進むほど相手は速い（反応の平均が小さくなっていく・同じは可）', meanOrder.every((v, i) => i === 0 || v <= meanOrder[i - 1]), meanOrder.join(' > '));

  // ---------- 5. ボットで勝ち抜き戦 ----------
  head('5. ボットで勝ち抜き戦');
  function playTournament(bot, seed) {
    Game.reset(seed); Game.begin(0);
    const brng = mulberry32(seed * 7919 + 13);
    let n = 0;
    while (Game.mode === 'match' && n++ < 20000) {
      if (Game.phase === 'wait') {
        let h = null;
        if (bot.read) { const e = habitHandOf(Game.opp, Game.hist); if (e != null) h = winHand(e); }
        if (h == null) h = Math.floor(brng() * 3);
        Game.selectHand(h, Game.time);
      } else if (Game.phase === 'grab' && !Game.pItem && bot.item(Game.rps)) {
        const react = Math.max(0.15, bot.react + (brng() + brng() + brng() - 1.5) * bot.jitter);
        Game.tapItem(bot.item(Game.rps), Game.ponT + react);
      } else Game.advanceTo(Game.endT);
    }
    Game.events.length = 0;
    return { champ: Game.tourney === 'champion', out: Game.oppIdx, over: Game.mode === 'over' };
  }
  const judge = rps => rps === 'win' ? 'hammer' : 'helmet';
  const bots = {
    read05: { name: '正しく判断 0.5 秒＋クセを読む', read: true, item: judge, react: 0.5, jitter: 0.1 },
    rand05: { name: '正しく判断 0.5 秒・手はランダム', read: false, item: judge, react: 0.5, jitter: 0.1 },
    read07: { name: '正しく判断 0.7 秒＋クセを読む', read: true, item: judge, react: 0.7, jitter: 0.1 },
    rand07: { name: '正しく判断 0.7 秒・手はランダム', read: false, item: judge, react: 0.7, jitter: 0.1 },
    ham03: { name: 'いつもハンマー 0.3 秒・手はランダム', read: false, item: () => 'hammer', react: 0.3, jitter: 0.05 },
    hamRead: { name: 'いつもハンマー 0.3 秒＋クセを読む', read: true, item: () => 'hammer', react: 0.3, jitter: 0.05 }
  };
  const N = 500, tour = {};
  for (const k in bots) {
    const dist = [0, 0, 0, 0, 0], ch = { v: 0 }; let ok = 0;
    for (let s = 1; s <= N; s++) {
      const rr = playTournament(bots[k], s);
      if (rr.over) ok++;
      if (rr.champ) ch.v++; else dist[rr.out]++;
    }
    tour[k] = ch.v / N;
    info(bots[k].name + '：優勝 ' + ch.v + ' / ' + N + '（' + pct(ch.v / N) + '）　敗退 1回戦 ' + dist[0] + ' / 2回戦 ' + dist[1] + ' / 3回戦 ' + dist[2] + ' / 4回戦 ' + dist[3] + ' / 決勝 ' + dist[4]);
    if (ok !== N) check('全部の勝ち抜き戦が終わる（' + k + '）', false);
  }
  check('正しく判断 0.5 秒＋クセを読むボットは優勝することがある（20〜50%）', tour.read05 >= 0.20 && tour.read05 <= 0.50, pct(tour.read05));
  check('クセを読むと読まないより優勝しやすい（0.5 秒）', tour.read05 > tour.rand05, pct(tour.read05) + ' > ' + pct(tour.rand05));
  check('0.5 秒でクセを読まないボットは優勝がまれ（20% 未満）', tour.rand05 < 0.20, pct(tour.rand05));
  check('0.7 秒のボット（クセを読んでも）はまれにしか優勝しない（10% 未満）', tour.read07 < 0.10 && tour.rand07 < 0.10, pct(tour.read07) + ' / ' + pct(tour.rand07));
  check('いつもハンマー（手はランダム）のボットはほぼ優勝できない（5% 未満）', tour.ham03 < 0.05, pct(tour.ham03));
  info('参考：いつもハンマーでもクセを読んで勝てる手を出すと優勝 ' + pct(tour.hamRead) + '（判断しなくても、読みで勝ち役が増えるぶん通る。正しく判断＋読み ' + pct(tour.read05) + ' より低い）');
  check('クセを読むだけのいつもハンマーより、正しく判断して読むボットのほうが優勝しやすい', tour.read05 > tour.hamRead, pct(tour.read05) + ' > ' + pct(tour.hamRead));
  check('0.5 秒のボットのほうが 0.7 秒より優勝しやすい（速さに意味がある）', tour.read05 > tour.read07 + 0.1, pct(tour.read05) + ' vs ' + pct(tour.read07));

  // 同じシードで同じ勝ち抜き戦になる
  const sig = s => { playTournament(bots.read05, s); return Game.oppIdx + '/' + Game.score.p + '-' + Game.score.c + '/' + Game.hist.map(h => h.p + '' + h.c).join(','); };
  check('同じシードなら同じ勝ち抜き戦になる（再現できる）', sig(42) === sig(42) && sig(42) !== sig(43), sig(42));

  const sum2 = document.createElement('h2');
  sum2.id = 'summary';
  sum2.textContent = fail === 0 ? 'RESULT: ALL PASS（' + total + ' 件）' : 'RESULT: FAIL（' + fail + ' / ' + total + ' 件 NG）';
  sum2.className = fail === 0 ? 'ok' : 'ng';
  out.appendChild(sum2);
  window.__verifyFail = fail;
})();
</script>
